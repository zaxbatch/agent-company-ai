<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#2b1a1a"/>
  <!-- fridge interior -->
  <rect x="80" y="60" width="640" height="460" rx="16" fill="#dfe8ee"/>
  <rect x="80" y="60" width="640" height="40" rx="16" fill="#c8d6de"/>
  <rect x="110" y="120" width="580" height="10" fill="#b8c6ce"/>
  <rect x="110" y="280" width="580" height="10" fill="#b8c6ce"/>
  <rect x="110" y="440" width="580" height="10" fill="#b8c6ce"/>
  <!-- Red ketchup -->
  <g transform="translate(220,150)">
    <rect x="20" y="40" width="70" height="110" rx="10" fill="#c62828"/>
    <rect x="40" y="0" width="30" height="45" rx="6" fill="#d63a3a"/>
    <rect x="48" y="-12" width="14" height="16" rx="3" fill="#e64a4a"/>
    <text x="55" y="90" font-size="13" fill="#fff" text-anchor="middle" font-family="monospace">KETCH</text>
    <circle cx="42" cy="28" r="6" fill="#fff"/>
    <circle cx="68" cy="28" r="6" fill="#fff"/>
    <circle cx="44" cy="29" r="3" fill="#111"/>
    <circle cx="66" cy="29" r="3" fill="#111"/>
    <path d="M45 46 Q55 54 65 46" stroke="#111" stroke-width="3" fill="none"/>
  </g>
  <!-- Yellow mustard -->
  <g transform="translate(470,160)">
    <rect x="20" y="40" width="70" height="110" rx="10" fill="#f9a825"/>
    <rect x="40" y="0" width="30" height="45" rx="6" fill="#fbc02d"/>
    <rect x="48" y="-12" width="14" height="16" rx="3" fill="#ffd54f"/>
    <text x="55" y="90" font-size="13" fill="#3e2a00" text-anchor="middle" font-family="monospace">MUST</text>
    <circle cx="42" cy="28" r="6" fill="#fff"/>
    <circle cx="68" cy="28" r="6" fill="#fff"/>
    <circle cx="44" cy="29" r="3" fill="#111"/>
    <circle cx="66" cy="29" r="3" fill="#111"/>
    <path d="M45 46 L55 40 L65 46" stroke="#111" stroke-width="3" fill="none"/>
  </g>
  <!-- Red speech -->
  <rect x="150" y="330" width="180" height="44" rx="16" fill="#fff" stroke="#c62828" stroke-width="2"/>
  <text x="240" y="358" font-size="16" fill="#111" text-anchor="middle" font-family="monospace">I go with EVERYTHING.</text>
  <!-- Yellow speech -->
  <rect x="440" y="340" width="190" height="44" rx="16" fill="#fff" stroke="#f9a825" stroke-width="2"/>
  <text x="535" y="368" font-size="16" fill="#111" text-anchor="middle" font-family="monospace">I was here FIRST.</text>
  <text x="400" y="560" font-size="24" fill="#ffd166" text-anchor="middle" font-family="monospace" font-weight="bold">FRIDGE RIVALS — DAY 4,000</text>
</svg>
