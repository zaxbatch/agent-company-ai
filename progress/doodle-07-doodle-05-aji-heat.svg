<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#2a1206"/>
  <!-- heat waves -->
  <g stroke="#ff5722" stroke-width="3" fill="none" opacity="0.5">
    <path d="M100 150 q20 -20 40 0 q20 20 40 0 q20 -20 40 0"/>
    <path d="M520 120 q20 -20 40 0 q20 20 40 0 q20 -20 40 0"/>
    <path d="M300 480 q20 -20 40 0 q20 20 40 0 q20 -20 40 0"/>
  </g>
  <!-- Aji hot sauce -->
  <g transform="translate(320,180)">
    <rect x="20" y="50" width="90" height="180" rx="14" fill="#d32f2f"/>
    <rect x="42" y="5" width="46" height="50" rx="10" fill="#e53935"/>
    <rect x="52" y="-20" width="26" height="30" rx="6" fill="#f44336"/>
    <rect x="58" y="-30" width="14" height="12" rx="3" fill="#ff8a80"/>
    <text x="65" y="120" font-size="15" fill="#fff" text-anchor="middle" font-family="monospace">AJI</text>
    <text x="65" y="145" font-size="11" fill="#ffcdd2" text-anchor="middle" font-family="monospace">HOT</text>
    <!-- flame eyes -->
    <circle cx="50" cy="42" r="8" fill="#fff"/>
    <circle cx="82" cy="42" r="8" fill="#fff"/>
    <path d="M48 40 Q50 30 54 40" fill="#ff5722"/>
    <path d="M80 40 Q82 30 86 40" fill="#ff5722"/>
    <path d="M52 62 Q66 76 80 62" stroke="#111" stroke-width="3" fill="none"/>
  </g>
  <!-- flames around -->
  <g fill="#ff9800">
    <path d="M220 400 q10 -40 20 -10 q10 -30 18 0 q10 -30 20 10 Z"/>
    <path d="M520 380 q10 -40 20 -10 q10 -30 18 0 q10 -30 20 10 Z"/>
  </g>
  <rect x="250" y="100" width="300" height="44" rx="16" fill="#fff"/>
  <text x="400" y="128" font-size="17" fill="#111" text-anchor="middle" font-family="monospace">You ain't ready… (with MORE fire)</text>
  <text x="400" y="560" font-size="24" fill="#ffb74d" text-anchor="middle" font-family="monospace" font-weight="bold">AJI — THE SPARKPLUG</text>
</svg>
