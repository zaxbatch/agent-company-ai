<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❄️ Snow Snakes · zerric.xyz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 20% 20%, #1a3a4f, #0b1e2b);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Quicksand', system-ui, sans-serif;
      padding: 1rem;
    }

    .game-wrapper {
      background: #0f2a3b;
      border-radius: 3.5rem;
      padding: 1.8rem 2.2rem 2.5rem;
      box-shadow: 0 25px 35px rgba(0, 0, 0, 0.7), inset 0 0 15px #3e6d8c;
      border: 1px solid #7ab3d4;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.5rem 1.2rem 0.5rem;
      color: #d9ecff;
      text-shadow: 2px 2px 0 #0a1a24;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 2rem;
    }

    .title span {
      font-size: 2rem;
      filter: drop-shadow(0 0 6px #b3e0ff);
    }

    .score-box {
      background: #1b3f55;
      padding: 0.7rem 1.6rem;
      border-radius: 4rem;
      font-size: 1.5rem;
      box-shadow: inset 0 -4px 0 #0b1e28, 0 8px 0 #07151e;
      color: #e3f2fd;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .score-box span {
      font-size: 1.9rem;
      font-weight: 700;
      color: #fff6b0;
      text-shadow: 0 0 10px #f0e68c;
    }

    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 2.5rem;
      box-shadow: inset 0 0 0 4px #2f5e7a, 0 18px 25px -5px #030e14;
      background: #102c3c;
      width: 100%;
      max-width: 500px;
      height: auto;
      aspect-ratio: 1/1;
      cursor: pointer;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .btn {
      background: #2b5c79;
      border: none;
      border-bottom: 6px solid #0e1f2b;
      color: #eaf6ff;
      font-weight: 700;
      font-size: 1.4rem;
      padding: 0.9rem 2rem;
      border-radius: 4rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      cursor: pointer;
      transition: all 0.05s ease-in;
      box-shadow: 0 8px 0 #07141d;
      text-shadow: 0 2px 0 #091a24;
      flex: 1 0 auto;
      min-width: 140px;
    }

    .btn:active {
      transform: translateY(6px);
      border-bottom-width: 2px;
      box-shadow: 0 2px 0 #07141d;
    }

    .btn.reset {
      background: #416d8a;
    }

    .btn i {
      font-size: 1.6rem;
      font-style: normal;
      filter: drop-shadow(0 0 5px #c2e2ff);
    }

    .footer {
      text-align: center;
      margin-top: 1.6rem;
      color: #90b8d0;
      font-size: 1rem;
      letter-spacing: 1px;
      text-shadow: 0 2px 3px black;
    }

    .footer a {
      color: #c6e2ff;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 2px dotted #3d6c8a;
    }

    @media (max-width: 500px) {
      .game-wrapper {
        padding: 1.2rem 1.2rem 2rem;
        border-radius: 2.5rem;
      }
      .title {
        font-size: 1.4rem;
      }
      .title span {
        font-size: 1.6rem;
      }
      .score-box {
        font-size: 1.2rem;
        padding: 0.5rem 1.2rem;
      }
      .btn {
        font-size: 1.1rem;
        padding: 0.7rem 1rem;
        min-width: 110px;
      }
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="header">
      <div class="title">
        <span>🐍</span> SnowSnakes <span>❄️</span>
      </div>
      <div class="score-box">
        🏆 <span id="scoreDisplay">0</span>
      </div>
    </div>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div class="controls">
      <button class="btn" id="newGameBtn"><i>🔄</i> New Game</button>
      <button class="btn reset" id="pauseToggleBtn"><i>⏸️</i> Pause</button>
    </div>
    <div class="footer">
      <a href="https://snowsnakes.zerric.xyz" target="_blank">snowsnakes.zerric.xyz</a> · stay frosty
    </div>
  </div>

  <script>
    (function(){
      // ----- CONFIGURATION -----
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreSpan = document.getElementById('scoreDisplay');

      // Grid settings
      const GRID_SIZE = 20;          // 20x20 cells
      const CELL_SIZE = canvas.width / GRID_SIZE;

      // Game state
      let snake = [];                // array of {x, y}
      let food = { x: 8, y: 10 };
      let direction = 'RIGHT';       // current moving direction
      let nextDirection = 'RIGHT';
      let score = 0;
      let gameOver = false;
      let winFlag = false;           // to distinguish win from loss
      let paused = false;
      let gameLoopInterval = null;
      const MOVE_INTERVAL_MS = 150;  // smooth snake speed

      // ----- HELPER FUNCTIONS -----
      function randomInt(max) {
        return Math.floor(Math.random() * max);
      }

      // Generate new food at empty cell
      function generateRandomFood() {
        const totalCells = GRID_SIZE * GRID_SIZE;
        if (snake.length >= totalCells) {
          // win condition: snake fills entire board
          return null;
        }

        // collect free cells
        const freeCells = [];
        // brute force but grid is small (400 cells)
        for (let i = 0; i < GRID_SIZE; i++) {
          for (let j = 0; j < GRID_SIZE; j++) {
            if (!snake.some(segment => segment.x === i && segment.y === j)) {
              freeCells.push({ x: i, y: j });
            }
          }
        }
        if (freeCells.length === 0) return null;
        const rand = Math.floor(Math.random() * freeCells.length);
        return freeCells[rand];
      }

      // Initialize (or reset) game
      function initGame() {
        // stop any existing loop
        if (gameLoopInterval) {
          clearInterval(gameLoopInterval);
          gameLoopInterval = null;
        }

        // starting snake: length 3, placed in a safe area
        snake = [
          { x: 9, y: 10 },  // head
          { x: 8, y: 10 },
          { x: 7, y: 10 }
        ];
        direction = 'RIGHT';
        nextDirection = 'RIGHT';
        score = 0;
        gameOver = false;
        winFlag = false;
        paused = false;
        document.getElementById('pauseToggleBtn').innerHTML = '<i>⏸️</i> Pause';

        // place food (ensure not on snake)
        const newFood = generateRandomFood();
        if (newFood) food = newFood;
        else {
          // extremely unlikely at start, but fallback
          food = { x: 15, y: 15 };
        }

        updateScore();
        drawGame();

        // start the game loop
        gameLoopInterval = setInterval(gameTick, MOVE_INTERVAL_MS);
      }

      // Update score display
      function updateScore() {
        scoreSpan.textContent = score;
      }

      // ----- GAME LOGIC (TICK) -----
      function gameTick() {
        if (paused || gameOver) return;

        // apply the queued direction (prevent 180° reversal)
        if (nextDirection === 'UP' && direction !== 'DOWN') direction = nextDirection;
        else if (nextDirection === 'DOWN' && direction !== 'UP') direction = nextDirection;
        else if (nextDirection === 'LEFT' && direction !== 'RIGHT') direction = nextDirection;
        else if (nextDirection === 'RIGHT' && direction !== 'LEFT') direction = nextDirection;

        // compute new head position
        const head = snake[0];
        let newHead = { ...head };

        switch (direction) {
          case 'RIGHT': newHead.x += 1; break;
          case 'LEFT':  newHead.x -= 1; break;
          case 'UP':    newHead.y -= 1; break;
          case 'DOWN':  newHead.y += 1; break;
          default: break;
        }

        // check for wall collision
        if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
          gameOver = true;
          winFlag = false;
          drawGame();
          return;
        }

        // check if food is eaten
        const foodEaten = (newHead.x === food.x && newHead.y === food.y);

        // build new snake array
        let newSnake = [newHead, ...snake];

        if (foodEaten) {
          // keep the tail (snake grows)
          // newSnake already includes old snake, so length +1
          snake = newSnake;
          score += 10;
          updateScore();

          // generate new food
          const newFood = generateRandomFood();
          if (newFood) {
            food = newFood;
          } else {
            // board is full -> WIN!
            gameOver = true;
            winFlag = true;
            drawGame();
            return;
          }
        } else {
          // remove tail
          newSnake.pop();
          snake = newSnake;
        }

        // check self-collision (head collides with body)
        const headCollision = snake.slice(1).some(segment => segment.x === snake[0].x && segment.y === snake[0].y);
        if (headCollision) {
          gameOver = true;
          winFlag = false;
          drawGame();
          return;
        }

        // check win condition again (full board) after eating
        if (snake.length === GRID_SIZE * GRID_SIZE) {
          gameOver = true;
          winFlag = true;
          drawGame();
          return;
        }

        drawGame();
      }

      // ----- RENDERING (with snow & frost theme) -----
      function drawGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // draw background grid (frosty)
        ctx.fillStyle = '#0c2533';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // subtle grid lines
        ctx.strokeStyle = '#2c5068';
        ctx.lineWidth = 0.7;
        for (let i = 0; i <= GRID_SIZE; i++) {
          const pos = i * CELL_SIZE;
          ctx.beginPath();
          ctx.moveTo(pos, 0);
          ctx.lineTo(pos, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, pos);
          ctx.lineTo(canvas.width, pos);
          ctx.stroke();
        }

        // draw snowflakes (decorative) - random pattern
        ctx.fillStyle = '#b3d9f0';
        for (let i = 0; i < 40; i++) {
          // deterministic pseudo-random positions based on cell coords
          const x = (i * 37) % canvas.width;
          const y = (i * 83) % canvas.height;
          ctx.beginPath();
          ctx.arc(x, y, 1.5 + (i % 3), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(200, 235, 255, ${0.2 + (i % 5) * 0.07})`;
          ctx.fill();
        }

        // draw snake (snowy serpent)
        snake.forEach((segment, index) => {
          const x = segment.x * CELL_SIZE;
          const y = segment.y * CELL_SIZE;
          const padding = index === 0 ? 2 : 3; // head slightly larger
          const radius = (CELL_SIZE / 2) - (index === 0 ? 2 : 4);

          // head is brighter
          if (index === 0) {
            // head gradient
            const grad = ctx.createRadialGradient(
              x + CELL_SIZE/2, y + CELL_SIZE/2, 2,
              x + CELL_SIZE/2, y + CELL_SIZE/2, CELL_SIZE/1.8
            );
            grad.addColorStop(0, '#f0faff');
            grad.addColorStop(0.7, '#9ac7e7');
            grad.addColorStop(1, '#4b7a9c');
            ctx.fillStyle = grad;
          } else {
            // body gradient – icy blue
            const gradient = ctx.createLinearGradient(x, y, x + CELL_SIZE, y + CELL_SIZE);
            gradient.addColorStop(0, '#b7dff7');
            gradient.addColorStop(1, '#3d6b8b');
            ctx.fillStyle = gradient;
          }

          // rounded snake segments
          ctx.shadowColor = '#aae0ff';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.roundRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4, 7);
          ctx.fill();

          // eyes on head
          if (index === 0) {
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#0d1f2c';
            // left eye
            ctx.beginPath();
            ctx.arc(x + CELL_SIZE * 0.35, y + CELL_SIZE * 0.4, CELL_SIZE * 0.1, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + CELL_SIZE * 0.65, y + CELL_SIZE * 0.4, CELL_SIZE * 0.1, 0, Math.PI * 2);
            ctx.fill();
            // eye shine
            ctx.fillStyle = '#f0f9ff';
            ctx.beginPath();
            ctx.arc(x + CELL_SIZE * 0.33, y + CELL_SIZE * 0.37, CELL_SIZE * 0.04, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + CELL_SIZE * 0.63, y + CELL_SIZE * 0.37, CELL_SIZE * 0.04, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        // reset shadow
        ctx.shadowBlur = 0;

        // draw food (frozen berry / ice gem)
        const fx = food.x * CELL_SIZE;
        const fy = food.y * CELL_SIZE;

        // glowing snowflake / ice crystal
        ctx.shadowColor = '#c2e9ff';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(fx + CELL_SIZE/2, fy + CELL_SIZE/2, CELL_SIZE * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = '#d4f0ff';
        ctx.fill();

        // inner shine
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(fx + CELL_SIZE/2, fy + CELL_SIZE/2, CELL_SIZE * 0.18, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        // small sparkles
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#f0fbff';
        ctx.beginPath();
        ctx.arc(fx + CELL_SIZE*0.3, fy + CELL_SIZE*0.3, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(fx + CELL_SIZE*0.7, fy + CELL_SIZE*0.7, 2, 0, Math.PI*2);
        ctx.fill();

        // reset shadow
        ctx.shadowBlur = 0;

        // draw Game Over / Win overlay
        if (gameOver) {
          ctx.fillStyle = 'rgba(8, 25, 35, 0.8)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.font = 'bold 34px "Segoe UI", "Quicksand", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          if (winFlag) {
            ctx.fillStyle = '#e9ffb0';
            ctx.shadowColor = '#f5ffb0';
            ctx.shadowBlur = 20;
            ctx.fillText('❄️ YOU WIN! ❄️', canvas.width/2, canvas.height/2 - 20);
            ctx.font = 'bold 20px sans-serif';
            ctx.fillStyle = '#c2e2ff';
            ctx.fillText('perfect snow snake!', canvas.width/2, canvas.height/2 + 40);
          } else {
            ctx.fillStyle = '#ffb8b8';
            ctx.shadowColor = '#ff8a8a';
            ctx.shadowBlur = 16;
            ctx.fillText('❄️ GAME OVER ❄️', canvas.width/2, canvas.height/2 - 20);
            ctx.font = 'bold 20px sans-serif';
            ctx.fillStyle = '#b0d9f0';
            ctx.fillText('press New Game', canvas.width/2, canvas.height/2 + 40);
          }
          ctx.shadowBlur = 0;
        } else if (paused) {
          ctx.fillStyle = 'rgba(10, 30, 40, 0.7)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.font = 'bold 32px "Segoe UI", sans-serif';
          ctx.fillStyle = '#bfe6ff';
          ctx.shadowColor = '#6aa9cc';
          ctx.shadowBlur = 14;
          ctx.fillText('⏸ PAUSED', canvas.width/2, canvas.height/2);
          ctx.shadowBlur = 0;
        }
      }

      // helper for rounded rect
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        return this;
      };

      // ----- EVENT LISTENERS -----
      function handleKeyDown(e) {
        const key = e.key;
        // prevent arrow scrolling
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
          e.preventDefault();
        }

        if (gameOver || paused) return;

        if (key === 'ArrowUp' || key === 'w' || key === 'W') {
          if (direction !== 'DOWN') nextDirection = 'UP';
        } else if (key === 'ArrowDown' || key === 's' || key === 'S') {
          if (direction !== 'UP') nextDirection = 'DOWN';
        } else if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
          if (direction !== 'RIGHT') nextDirection = 'LEFT';
        } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
          if (direction !== 'LEFT') nextDirection = 'RIGHT';
        }
      }

      // Pause toggle
      function togglePause() {
        if (gameOver) return;
        paused = !paused;
        const btn = document.getElementById('pauseToggleBtn');
        if (paused) {
          btn.innerHTML = '<i>▶️</i> Resume';
        } else {
          btn.innerHTML = '<i>⏸️</i> Pause';
        }
        drawGame();
      }

      // New game button
      function newGame() {
        initGame();
      }

      // ----- SETUP -----
      window.addEventListener('keydown', handleKeyDown);

      document.getElementById('newGameBtn').addEventListener('click', () => {
        newGame();
      });

      document.getElementById('pauseToggleBtn').addEventListener('click', togglePause);

      // also allow canvas click to pause? (optional) but we have button.
      // prevent context menu on canvas
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      // start the game on page load
      initGame();

      // clean-up on page unload (optional)
      window.addEventListener('beforeunload', () => {
        if (gameLoopInterval) clearInterval(gameLoopInterval);
      });
    })();
  </script>
</body>
</html>
