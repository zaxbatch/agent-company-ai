<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MilkUps — Vin's Anthem (Music Video)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#050208;color:#e8c0ff;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
  #stage{position:relative;width:640px;height:360px;background:#0a0310;overflow:hidden;border-radius:6px}
  /* animated rap-video bg */
  .bg{position:absolute;inset:0;background:linear-gradient(160deg,#150625,#0a0218 50%,#1c0530);overflow:hidden}
  .spot{position:absolute;border-radius:50%;filter:blur(8px);opacity:.5;animation:pulse 2s infinite alternate}
  .spot.r1{width:300px;height:300px;left:-80px;top:-80px;background:#d500f9}
  .spot.r2{width:250px;height:250px;right:-60px;bottom:-60px;background:#7fd1ff;animation-delay:.5s}
  .spot.r3{width:180px;height:180px;left:200px;top:60px;background:#e040fb;animation-delay:1s}
  @keyframes pulse{from{opacity:.25;transform:scale(.95)}to{opacity:.55;transform:scale(1.05)}}
  .line{position:absolute;width:2px;background:linear-gradient(#d500f9,#7fd1ff);animation:scan 1.6s linear infinite}
  .lyric{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#fff;font-size:16px;font-weight:bold;letter-spacing:1px;text-shadow:0 0 12px #d500f9,0 0 30px #7fd1ff,0 2px 4px #000;z-index:6;opacity:0;transform:translateY(10px);transition:opacity .15s,transform .15s;font-family:monospace}
  .lyric.show{opacity:1;transform:translateY(0)}
  .lyric.big{font-size:22px;color:#ffd166;text-shadow:0 0 16px #ffd166,0 0 40px #e040fb,0 2px 4px #000}
  .char-wrap{position:absolute;z-index:5;display:flex;align-items:flex-end;justify-content:center}
  .char-wrap.vin{left:190px;bottom:20px}
  .char-wrap.que{left:520px;bottom:6px;transform:scale(.62);opacity:0;transition:opacity .2s}
  .char-wrap.que.show{opacity:1}
  #vinSvg,#queSvg{display:block}
  .title{position:absolute;left:0;right:0;top:60px;text-align:center;z-index:7;font-size:20px;letter-spacing:4px;color:#7fd1ff;text-shadow:0 0 14px #7fd1ff,0 0 30px #d500f9;font-weight:bold;opacity:0;transition:opacity .4s}
  .title.show{opacity:1}
  .controls{margin-top:10px}
  button{background:#3d1a55;color:#e8c0ff;border:1px solid #d500f9;padding:8px 18px;font-family:monospace;cursor:pointer;border-radius:6px}
  button:hover{background:#d500f955}
</style>
</head>
<body>
<div id="stage">
  <div class="bg">
    <div class="spot r1"></div><div class="spot r2"></div><div class="spot r3"></div>
  </div>
  <div class="title" id="title">MILKUPS · VIN'S ANTHEM</div>
  <div class="char-wrap vin"><svg id="vinSvg" viewBox="0 0 220 275" width="200" height="250">
  <defs>
    <linearGradient id="vinGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f1806"/>
      <stop offset="0.3" stop-color="#6e2608"/>
      <stop offset="0.5" stop-color="#7e2e0a"/>
      <stop offset="1" stop-color="#3a1003"/>
    </linearGradient>
  </defs>

  <!-- ===== WINE BOTTLE (flat bottom) ===== -->
  <path d="M92 44 L128 44 L128 78 Q128 94 140 106 L142 118 L142 252 Q142 260 135 262 L85 262 Q78 260 78 252 L78 118 L80 106 Q92 94 92 78 Z"
        fill="url(#vinGlass)" stroke="#200a02" stroke-width="2.5"/>

  <!-- ===== FACE (shades + mouth) on neck/shoulder ===== -->
  <g id="vinShades">

    <rect x="113" y="64" width="21" height="15" rx="4" fill="#0b0b0b" stroke="#e8c15a" stroke-width="2"/>

  <g id="vinMouth">
    <path d="M100 92 Q110 101 120 92" stroke="#160a02" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== LABEL (middle of bottle) ===== -->
  <g id="vinLabelWrap">
    <rect x="83" y="162" width="54" height="62" rx="3" fill="#f7ead0"/>
    <rect x="88" y="168" width="44" height="13" fill="#5a1803"/>
    <text x="110" y="178" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#ffe8d0">VIN NEGAR</text>
    <text x="110" y="196" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#4a1604">REALEST</text>
    <text x="110" y="207" text-anchor="middle" font-family="monospace" font-size="5.5" fill="#7e4a24">real vinegar</text>
    <text x="110" y="218" text-anchor="middle" font-family="monospace" font-size="6" fill="#5a2a12">est. cab-nets</text>
    <rect x="83" y="162" width="6" height="62" fill="#200a02" opacity=".35"/>
    <rect x="131" y="162" width="6" height="62" fill="#200a02" opacity=".35"/>
    <rect x="102" y="162" width="5" height="62" fill="#ffffff" opacity=".18"/>
  </g>

  <!-- ===== ARMS: attach at shoulder (just below taper), drawn before chain ===== -->
  <g id="vinArmL"><path d="M80 122 Q54 140 48 172" stroke="#1c0f06" stroke-width="11" stroke-linecap="round" fill="none"/></g>
  <g id="vinArmR"><path d="M140 122 Q166 140 172 172" stroke="#1c0f06" stroke-width="11" stroke-linecap="round" fill="none"/></g>

  <!-- ===== CHAIN: from neck, hangs ABOVE arms and dangles a little past them ===== -->
  <g id="vinChain">
    <path d="M82 100 Q110 150 138 100" stroke="#ffd700" stroke-width="4.5" fill="none"/>
    <path d="M88 106 L96 120 M96 110 L102 118 M124 110 L130 118 M132 106 L140 120" stroke="#ffd700" stroke-width="2.2"/>
    <circle cx="110" cy="124" r="10" fill="#111" stroke="#ffd700" stroke-width="3.5"/>
    <text x="110" y="130" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffd700">V</text>
  </g>

  <!-- ===== CAP: black w/ gold trim + ridges, tilted like a hat, DRAWN LAST (in front) ===== -->
  <g id="vinCap" transform="rotate(-14 110 46)">
    <path d="M86 44 Q88 16 110 14 Q132 16 134 44 L136 50 Q110 62 84 50 Z" fill="#0b0b0b"/>
    <!-- ridges on black -->
    <path d="M98 18 L98 55 M106 15.5 L106 55 M114 15.5 L114 55 M122 18 L122 55" stroke="#222" stroke-width="1.2"/>
    <!-- gold bottom trim -->
    <path d="M84 50 Q110 62 136 50 L136 56 Q110 68 84 56 Z" fill="#ffd700"/>
    <!-- brim -->
    <path d="M134 40 Q150 42 154 50 L136 54 Z" fill="#0b0b0b" stroke="#ffd700" stroke-width="1"/>
  </g>

  <!-- shoes -->
  <rect x="84" y="260" width="24" height="10" rx="4" fill="#0a0a0a"/>
  <rect x="112" y="260" width="24" height="10" rx="4" fill="#0a0a0a"/>
</svg></div>
  <div class="char-wrap que" id="qWrap"><svg id="queSvg" viewBox="0 0 220 276" width="140" height="176">
  <defs>
    <linearGradient id="queBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d0f02"/>
      <stop offset="0.3" stop-color="#6e1c04"/>
      <stop offset="0.5" stop-color="#7e2406"/>
      <stop offset="1" stop-color="#3a0a01"/>
    </linearGradient>
  </defs>

  <!-- ===== RANCH/BBQ SQUEEZE BOTTLE ===== -->
  <!-- flip cap -->
  <path d="M94 40 L126 40 L124 50 L96 50 Z" fill="#e04040"/>
  <rect x="98" y="34" width="24" height="7" rx="3" fill="#b83232"/>
  <!-- long clean neck -->
  <rect x="92" y="50" width="36" height="64" fill="url(#queBody)" stroke="#2a0a01" stroke-width="2"/>
  <!-- shoulders + body: flat bottom, sides bulge OUT (round) toward a flat base -->
  <!-- left side bows out, flat bottom, right side bows out -->
  <path d="M80 130 C 58 146, 54 196, 58 226 L 60 250 Q 62 256 72 256 L 148 256 Q 158 256 160 250 L 162 226 C 166 196, 162 146, 140 130 Z"
        fill="url(#queBody)" stroke="#2a0a01" stroke-width="2.5"/>
  <!-- flat bottom edge line -->
  <path d="M72 256 L148 256" stroke="#2a0a01" stroke-width="2.5"/>
  <!-- shoulder cap left (neck to shoulder) -->
  <path d="M92 116 L84 116 Q80 120 80 130 L84 132 Q90 120 92 118 Z" fill="url(#queBody)"/>
  <path d="M128 116 L136 116 Q140 120 140 130 L136 132 Q130 120 128 118 Z" fill="url(#queBody)"/>
  <!-- smooth neck join -->
  <rect x="92" y="112" width="36" height="6" fill="url(#queBody)"/>
  <!-- gloss -->
  <rect x="70" y="176" width="5" height="60" rx="2.5" fill="#ffffff12"/>

  <!-- ===== FACE: sits ON THE NECK ===== -->
  <!-- eyes (on the neck, narrower) -->
  <g id="queEyes">
    <circle cx="99" cy="72" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="121" cy="72" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="100" cy="73" r="2.8" fill="#111"/>
    <circle cx="122" cy="73" r="2.8" fill="#111"/>
  </g>
  <!-- mouth (on neck, below eyes) -->
  <g id="queMouth">
    <path d="M99 88 Q110 97 121 88" stroke="#1f0500" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="108" y="89" width="6" height="6" rx="1.5" fill="#ffd700"/>
  </g>

  <g id="queChain">
    <path d="M88 126 Q110 196 132 126" stroke="#ffd700" stroke-width="4.5" fill="none"/>
    <path d="M93 132 L102 152 M102 138 L110 148 M118 138 L126 148 M127 132 L136 152" stroke="#ffd700" stroke-width="2.2"/>
    <path d="M110 158 l-7 18 a7 7 0 0 0 14 0 Z" fill="#ff8a3d" stroke="#ffd700" stroke-width="1.8"/>
  </g>

  <!-- ===== BANDANA at the neck (BBQ neck-label as gangsta kerchief) ===== -->
  <g id="queBandana">
    <!-- wrapped band around the neck -->
    <path d="M86 104 L134 104 L136 124 Q136 132 110 132 Q84 132 84 124 Z" fill="#8a1a08" stroke="#4a0a02" stroke-width="1.5"/>
    <!-- polka dots / pattern -->
    <circle cx="96" cy="112" r="2.2" fill="#ff8a5a"/>
    <circle cx="110" cy="114" r="2.2" fill="#ff8a5a"/>
    <circle cx="124" cy="112" r="2.2" fill="#ff8a5a"/>
    <circle cx="103" cy="124" r="2.2" fill="#ff8a5a"/>
    <circle cx="117" cy="124" r="2.2" fill="#ff8a5a"/>
    <!-- knot + hanging tails front-left -->
    <path d="M104 130 L98 140 L100 142 L108 132 Z" fill="#6e1404"/>
    <path d="M100 138 Q96 150 92 158 L98 158 Q104 150 108 142 Z" fill="#8a1a08"/>
    <path d="M102 142 Q108 152 112 156 L116 154 Q110 146 106 140 Z" fill="#6e1404"/>
  </g>

  <!-- ===== CHAIN: hangs at the BASE of the neck / shoulder ===== -->

  <!-- ===== ARMS: attach at shoulders, over label ===== -->
  <g id="queArmL"><path d="M74 150 Q54 176 52 206" stroke="#5a1603" stroke-width="12" stroke-linecap="round" fill="none"/></g>
  <g id="queArmR"><path d="M146 150 Q166 176 168 206" stroke="#5a1603" stroke-width="12" stroke-linecap="round" fill="none"/></g>

  <!-- ===== LABEL: trapezoid matching taper ===== -->
  <g id="queLabelWrap">
    <path d="M66 190 L154 190 L152 244 L68 244 Z" fill="#f7ead0"/>
    <rect x="74" y="196" width="72" height="13" fill="#6e1c04"/>
    <text x="110" y="205" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="bold" fill="#ffe8d0">Q'S</text>
    <text x="110" y="224" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#5a1803">BBQ SAUCE</text>
    <text x="110" y="236" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#7e4a24">Q · pass the vibe</text>
    <path d="M66 190 L76 190 L74 244 L68 244 Z" fill="#1f0500" opacity=".4"/>
    <path d="M144 190 L154 190 L152 244 L146 244 Z" fill="#1f0500" opacity=".4"/>
  </g>

  <rect x="78" y="262" width="30" height="12" rx="5" fill="#0a0a0a"/>
  <rect x="112" y="262" width="30" height="12" rx="5" fill="#0a0a0a"/>
</svg></div>
  <div class="lyric" id="lyric"></div>
</div>
<div class="controls"><button id="playBtn">▶ Play</button><button id="replayBtn">↺</button></div>
<audio id="audio"></audio>
<script>
var lyric=document.getElementById('lyric'), title=document.getElementById('title');
var qWrap=document.getElementById('qWrap');
var vinSvg=document.getElementById('vinSvg');
// timeline of lyric beats (seconds) - sync'd to mv_audio mix
var BEATS=[
  {t:0.6, text:"Yo Vin Vin! He's the realest, realest!", big:false},
  {t:2.4, text:"Yo Vin Vin! He's the realest, the realest!", big:false},
  {t:4.2, text:"Yo Vin Vin! He's the realest, realest!", big:false},
  {t:6.0, text:"He's the realest vinegar you know!", big:true},
  {t:8.0, text:"YOU KNOW!", big:true},
  {t:9.6, text:"Yo Vin Vin! He's the realest, the realest!", big:false},
  {t:11.4,text:"He's the realest vinegar you know!", big:true},
  {t:13.2,text:"YOU KNOW!", big:true}
];
var cur=-1;
function tick(){
  var t=audio.currentTime;
  // show next beat when reached
  while(cur+1<BEATS.length && t>=BEATS[cur+1].t){
    cur++;
    var b=BEATS[cur];
    lyric.textContent=b.text;
    lyric.className='lyric'+(b.big?' big':'')+' show';
    // Q appears at 8.0+ (hype cameo), Vin pulses
    if(cur>=4){qWrap.classList.add('show');}
    else {qWrap.classList.remove('show');}
    pulse();
    // hide lyric after 1.6s or when next arrives
    clearTimeout(lyric._h);
    lyric._h=setTimeout(function(){lyric.classList.remove('show');},1600);
  }
  requestAnimationFrame(tick);
}
function pulse(){
  vinSvg.style.transition='transform .15s';
  vinSvg.style.transform='scale(1.03)';
  setTimeout(function(){vinSvg.style.transform='scale(1)';},150);
}
var audio=document.getElementById('audio');
audio.src='commercial/mv_audio.mp3';
audio.addEventListener('loadedmetadata',function(){});
document.getElementById('playBtn').onclick=function(){
  title.classList.add('show');
  audio.currentTime=0; audio.play();
  cur=-1;
  setTimeout(function(){title.classList.remove('show');},2400);
  requestAnimationFrame(tick);
};
document.getElementById('replayBtn').onclick=function(){
  audio.currentTime=0; audio.play();
};
// background scan lines
var bg=document.querySelector('.bg');
for(var i=0;i<12;i++){var l=document.createElement('div');l.className='line';
  l.style.cssText='top:0;height:'+360+'px;left:'+(i*55+10)+'px;animation-delay:'+(i*0.13)+'s;opacity:.15';bg.appendChild(l);}
</script>
</body>
</html>
