<title>MilkUps — Vin's Anthem (Official Music Video)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden;background:#000;font-family:monospace}
  #stage{position:absolute;top:0;left:0;width:1280px;height:720px;overflow:hidden;background:#0a0310}

  /* ===== SCENES ===== */
  .scene{position:absolute;inset:0;opacity:0;transition:opacity .6s;pointer-events:none}
  .scene.active{opacity:1}

  /* Scene 1: CAB-NET (shelf with bottles) */
  #scene-cabnet{background:linear-gradient(180deg,#241509 0%,#1c0e06 60%,#150e08 100%)}
  .shelf{position:absolute;left:0;width:100%;height:6px;background:#5c3317;box-shadow:0 2px 0 #3a1f0c}
  .bottle{position:absolute;border-radius:6px;background:#7a2a10;border:2px solid #8a3d1c}
  .bottle .lab{position:absolute;left:2px;right:2px;top:30%;height:26%;background:#ffe0b0;border-radius:2px}
  .door{position:absolute;top:0;bottom:0;width:200px;background:linear-gradient(90deg,#6e3a1c,#4a2a14);z-index:0}
  .door.left{left:0;transform:perspective(900px) rotateY(-24deg);transform-origin:left}
  .door.right{right:0;transform:perspective(900px) rotateY(24deg);transform-origin:right}

  /* Scene 2: CEREAL CAR RIDE */
  #scene-ride{background:linear-gradient(180deg,#1a0f2a,#0d0620)}
  .road{position:absolute;bottom:0;left:0;width:200%;height:140px;background:#15101f;z-index:1}
  .roadline{position:absolute;bottom:70px;width:100%;height:4px;background:repeating-linear-gradient(90deg,#ffd166 0 60px,transparent 60px 120px)}
  .bgcereal{position:absolute;bottom:150px;background:#c25e2b;border:2px solid #7a2a10;border-radius:4px;width:140px;height:200px;z-index:0}
  .car{position:absolute;bottom:130px;width:340px;height:200px;z-index:3;transition:left .3s linear}
  .cartop{position:absolute;bottom:170px;left:20px;width:300px;height:60px;background:#e040fb;border-radius:14px 14px 0 0;border:3px solid #0d0d0d}
  .carface{position:absolute;bottom:110px;left:10px;width:320px;height:80px;background:#ffd166;border:3px solid #0d0d0d;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;color:#8a4a12;letter-spacing:2px}
  .wheel{position:absolute;bottom:90px;width:60px;height:60px;border-radius:50%;background:#111;border:6px solid #444}
  .wheel:after{content:'';position:absolute;inset:10px;border-radius:50%;background:#333}

  /* Scene 3: KETCHUP PUDDLE */
  #scene-ketchup{background:linear-gradient(180deg,#20060a,#2a0a10 60%,#1a0505)}
  .puddle{position:absolute;left:300px;bottom:80px;width:500px;height:70px;background:radial-gradient(ellipse at center,#e0241a,#a01810);border-radius:50%;opacity:.9;z-index:1}
  .ketchup-bottle{position:absolute;left:620px;bottom:95px;z-index:2;transform:rotate(80deg)}
  .floorline{position:absolute;bottom:60px;left:0;width:100%;height:4px;background:#1a0505}

  /* Scene 4: FINALE crowd */
  #scene-finale{background:radial-gradient(circle at center,#3a0a3a,#0a0310)}
  .spot{position:absolute;border-radius:50%;filter:blur(10px);opacity:.5;animation:pulse 2s infinite alternate}
  @keyframes pulse{from{opacity:.3}to{opacity:.6}}

  /* ===== CHARACTERS ===== */
  .char-wrap{position:absolute;z-index:5;display:flex;align-items:flex-end}
  #vinWrap1{left:520px;bottom:90px;transform:scale(1.2)}
  #queWrap1{right:240px;bottom:40px;transform:scale(.7)}
  #vinWrap2{left:260px;bottom:120px;transform:scale(1.1)}  /* on cereal car */
  #queWrap3{left:80px;bottom:80px;transform:scale(.9)}
  #vinWrap4{left:460px;bottom:70px;transform:scale(1.4)}
  #queWrap4{right:360px;bottom:60px;transform:scale(1.0)}
  .char-wrap svg{display:block}

  /* ===== LYRICS ===== */
  .lyric{position:absolute;left:0;right:0;bottom:70px;text-align:center;color:#fff;font-size:42px;font-weight:bold;letter-spacing:1px;font-family:'Arial Black',Arial,sans-serif;text-shadow:0 0 18px #d500f9,0 0 40px #7fd1ff,0 3px 6px #000;z-index:20;opacity:0;transform:scale(.9);transition:opacity .12s,transform .12s}
  .lyric.show{opacity:1;transform:scale(1)}
  .lyric.chant{color:#ffd166;font-size:72px;text-shadow:0 0 20px #ffd166,0 0 60px #e040fb,0 4px 8px #000}

  /* ===== controls (hidden in rec) ===== */
  .controls{position:absolute;bottom:5px;left:0;right:0;z-index:50;display:none}
  button{background:#3d1a55;color:#fff;border:1px solid #d500f9;padding:10px 20px;font-family:monospace;cursor:pointer;border-radius:8px}
</style>
