<script>
var q1=document.getElementById('q1'), q2=document.getElementById('q2'),
    v1=document.getElementById('v1'), v2=document.getElementById('v2'),
    music=document.getElementById('music');
var bQ=document.getElementById('bubbleQ'), bV=document.getElementById('bubbleV'),
    bqText=document.getElementById('bqText'), bvText=document.getElementById('bvText');
var roach=document.getElementById('roach');
var ec=document.getElementById('endcard');
var playing=false, started=false, clock=0;

// mouth elements
var qMouth=document.getElementById('queMouth'), vMouth=document.getElementById('vinMouth');
var qOrig='<path d="M99 88 Q110 97 121 88" stroke="#1f0500" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="108" y="89" width="6" height="6" rx="1.5" fill="#ffd700"/>';
var vOrig='<path d="M100 92 Q110 101 120 92" stroke="#160a02" stroke-width="3" fill="none" stroke-linecap="round"/>';
qMouth.innerHTML=qOrig; vMouth.innerHTML=vOrig;

function showQ(t){bqText.textContent=t;bQ.style.display='block';}
function showV(t){bvText.textContent=t;bV.style.display='block';}
function hideB(){bQ.style.display='none';bV.style.display='none';}

// lip sync: set mouth open/closed during a line. open for given speaker bool.
var lipsIV=null;
function lipsync(speaker, dur){
  if(lipsIV) clearInterval(lipsIV);
  var t=0; lipsIV=setInterval(function(){
    t+=60; var open=(Math.sin(t/90)>0);
    if(speaker==='que'){ qMouth.innerHTML = open ? '<ellipse cx="110" cy="93" rx="9" ry="6" fill="#1f0500"/><rect x="107" y="89" width="6" height="6" rx="1.5" fill="#ffd700"/>' : qOrig; }
    else if(speaker==='vin'){ vMouth.innerHTML = open ? '<ellipse cx="110" cy="97" rx="7" ry="5" fill="#160a02"/>' : vOrig; }
    if(t>=dur*1000){ clearInterval(lipsIV); qMouth.innerHTML=qOrig; vMouth.innerHTML=vOrig; }
  },60);
}
function stopLip(){ if(lipsIV) clearInterval(lipsIV); qMouth.innerHTML=qOrig; vMouth.innerHTML=vOrig; }

// bob animation for characters (idle vibe)
var bobIV=null; var tBob=0;
function startBob(){ /* characters stay still, planted on shelf */ }

// timeline: total ~17s
var TIMELINE=[];
var musicLow=false;
function duck(secs){
  // lower music during dialogue
  if(musicLow) return;
  musicLow=true;
  var target=0.12, step=0;
  var iv=setInterval(function(){ if(!musicLow){clearInterval(iv);return;}
    step++; music.volume=Math.max(target, music.volume-0.05);
    if(music.volume<=target){clearInterval(iv);}
  },40);
  setTimeout(function(){ musicLow=false; var iv2=setInterval(function(){
    music.volume=Math.min(1, music.volume+0.05);
    if(music.volume>=0.85){clearInterval(iv2);music.volume=1;}
  },40); }, secs*1000);
}
function runScene(){
  hideB(); roach.style.display='none'; ec.classList.remove('show');
  startBob(); music.volume=1; music.play();
  // 0s-2.3s: idle hang
  setTimeout(function(){
    // Que setup
    showQ("Yo Vin — check this out. How do you secure your stomach?");
    q1.play(); lipsync('que',2.8); duck(2.9);
  },2000);
  setTimeout(function(){ // Que punchline
    showQ("Belly button! Ha! Ha! Ha!"); q2.play(); lipsync('que',2.3); duck(2.4);
    // ROACH CRAWLS during the laugh
    roach.style.display='block';
    var x=0; var rIV=setInterval(function(){ x+=3; roach.style.left=x+'px'; if(x>730){clearInterval(rIV);roach.style.display='none';} },30);
  },4700);
  // Q keeps laughing in the background until Vin reacts
  setTimeout(function(){ var lt=0; var liv=setInterval(function(){ lt+=60;
    var open=(Math.sin(lt/110)>0);
    qMouth.innerHTML = open ? '<ellipse cx="110" cy="93" rx="9" ry="6" fill="#1f0500"/><rect x="107" y="89" width="6" height="6" rx="1.5" fill="#ffd700"/>' : qOrig;
    if(lt>2200){ clearInterval(liv); qMouth.innerHTML=qOrig; }
  },60); },7200);
  setTimeout(function(){ // Vin reaction
    hideB(); showV("Q. That was terrible.");
    v1.play(); lipsync('vin',1.3); duck(1.5);
  },7200);
  setTimeout(function(){ // Vin closer
    hideB(); showV("Get more dad jokes — snowsnakes.zerric.xyz");
    v2.play(); lipsync('vin',3.7); duck(3.9);
  },9000);
  setTimeout(function(){ // endcard
    hideB(); music.pause();
    ec.classList.add('show');
  },13600);
}
document.getElementById('playBtn').onclick=function(){
  if(playing) return; playing=true; started=true;
  this.textContent='▶ Playing…'; runScene();
};
document.getElementById('replayBtn').onclick=function(){
  // reset all
  q1.pause();q1.currentTime=0;q2.pause();q2.currentTime=0;v1.pause();v1.currentTime=0;v2.pause();v2.currentTime=0;
  stopLip(); hideB(); roach.style.display='none'; ec.classList.remove('show');
  qMouth.innerHTML=qOrig; vMouth.innerHTML=vOrig;
