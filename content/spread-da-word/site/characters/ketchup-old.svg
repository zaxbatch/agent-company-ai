<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 330" width="220" height="330">
  <defs>
    <linearGradient id="kGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d03020" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#e84838" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#f05848" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a02818" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- ===== HEINZ-57 STYLE UPSIDE DOWN (white cap at BOTTOM, standing on his head) ===== -->
  <!-- White cap at bottom -->
  <rect x="92" y="288" width="36" height="26" rx="6" fill="#f4f4f0" stroke="#c8c8c4" stroke-width="1.5"/>
  <path d="M94 282 L126 282 L126 288 L94 288 Z" fill="#e0e0dc"/>

  <!-- wide body at TOP (bottle bottom now up high) -->
  <path d="M78 60 Q78 14 110 12 Q142 14 142 60 Z" fill="url(#kGlass)" stroke="#a02818" stroke-width="2.5"/>
  <path d="M78 60 L142 60 L138 92 L82 92 Z" fill="url(#kGlass)" stroke="#a02818" stroke-width="1.5"/>
  <!-- short neck descends to cap -->
  <path d="M86 92 L134 92 L132 122 Q132 140 110 140 Q88 140 88 122 L86 92 Z" fill="url(#kGlass)" stroke="#a02818" stroke-width="1.5"/>
  <rect x="92" y="140" width="36" height="140" fill="url(#kGlass)" stroke="#a02818" stroke-width="1.5"/>

  <!-- translucent: dried streaks + pool near cap -->
  <path d="M84 70 L82 200 Q82 216 86 226 L84 70 Z" fill="#a02818" opacity=".5"/>
  <path d="M136 70 L138 206 Q138 220 134 230 L136 70 Z" fill="#a02818" opacity=".45"/>
  <!-- last smear at cap -->
  <path d="M90 260 L130 260 L130 284 Q130 290 110 292 Q90 290 90 284 L90 260 Z" fill="#b0150c" opacity=".8"/>
  <!-- shine -->
  <rect x="96" y="70" width="8" height="120" rx="4" fill="#ffffff33"/>
  <rect x="120" y="100" width="4" height="120" rx="2" fill="#ffffff22"/>

  <!-- ===== DAD LABEL (faded) ===== -->
  <g id="kDadLabel">
    <rect x="80" y="96" width="60" height="64" rx="6" fill="#e0c8a8"/>
    <rect x="80" y="96" width="60" height="12" fill="#8a6a3a"/>
    <text x="110" y="105" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#e8d8b8">KETCHUP</text>
    <text x="110" y="126" text-anchor="middle" font-family="serif" font-size="13" font-weight="bold" fill="#6a3a20">Pop</text>
    <text x="110" y="138" text-anchor="middle" font-family="serif" font-size="6" font-style="italic" fill="#8a6a50">25+ years</text>
    <text x="110" y="153" text-anchor="middle" font-family="monospace" font-size="5" fill="#a09070">HALF USED</text>
  </g>

  <!-- ===== FACE upright near bottom (by the cap) ===== -->
  <g id="kDadEyes">
    <ellipse cx="100" cy="242" rx="6.5" ry="5.5" fill="#fff" stroke="#3a0501" stroke-width="2"/>
    <ellipse cx="120" cy="242" rx="6.5" ry="5.5" fill="#fff" stroke="#3a0501" stroke-width="2"/>
    <circle cx="102" cy="243" r="3" fill="#3a0501"/>
    <circle cx="122" cy="243" r="3" fill="#3a0501"/>
    <path d="M92 233 L102 237 M94 232 L103 237" stroke="#3a0501" stroke-width="2.5" fill="none"/>
    <path d="M128 233 L118 237 M126 232 L117 237" stroke="#3a0501" stroke-width="2.5" fill="none"/>
    <path d="M94 250 Q100 252 106 250" stroke="#6a3020" stroke-width="1.2" opacity=".5"/>
    <path d="M114 250 Q120 252 126 250" stroke="#6a3020" stroke-width="1.2" opacity=".5"/>
  </g>
  <g id="kDadMouth">
    <path d="M100 266 Q110 260 120 266" stroke="#3a0501" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M100 260 Q110 256 120 260" stroke="#8a8a8a" stroke-width="2" fill="none" opacity=".7"/>

  <!-- arms crossed -->
  <g id="kDadArmL"><path d="M82 160 Q68 184 98 200" stroke="#5a0a03" stroke-width="8" stroke-linecap="round" fill="none"/></g>
  <g id="kDadArmR"><path d="M138 160 Q152 184 122 200" stroke="#5a0a03" stroke-width="8" stroke-linecap="round" fill="none"/></g>
</svg>
