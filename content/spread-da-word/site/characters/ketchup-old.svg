<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 330" width="220" height="330">
  <defs>
    <!-- TRANSLUCENT glass (mostly empty) -->
    <linearGradient id="popGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d04838" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#e86858" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#f07860" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#a03028" stop-opacity="0.38"/>
    </linearGradient>
  </defs>

  <!-- ===== POP = JR FLIPPED: wide body at TOP, neck descends, WHITE CAP at BOTTOM ===== -->
  <!-- White cap at BOTTOM (he stands on his head) -->
  <rect x="94" y="290" width="32" height="24" rx="6" fill="#f4f4f0" stroke="#c8c8c4" stroke-width="1.5"/>
  <path d="M96 284 L126 284 L126 290 L96 290 Z" fill="#d8d8d4"/>

  <!-- Wide flat-bottom-of-bottle now at TOP (the bottle's original base) -->
  <path d="M76 62 Q76 24 110 22 Q144 24 144 62 L144 82 Q144 90 110 92 Q76 90 76 82 Z"
        fill="url(#popGlass)" stroke="#a03028" stroke-width="2"/>
  <!-- flat top edge (was bottom) -->
  <path d="M78 58 Q110 50 142 58" fill="none" stroke="#a03028" stroke-width="1.5" opacity=".6"/>

  <!-- body descends, SMOOTH shoulder curve up into neck going DOWN -->
  <path d="M76 92 Q98 76 98 60 L98 60
           L122 60 L122 60 Q122 76 144 92 L144 200
           L144 258 Q144 284 110 286 Q76 284 76 258 L76 200 Z"
        fill="url(#popGlass)" stroke="#a03028" stroke-width="2.5"/>

  <!-- dried streaks (through glass) -->
  <path d="M82 100 L80 200 Q80 220 84 230 L82 100 Z" fill="#a03028" opacity=".4"/>
  <path d="M138 100 L140 210 Q140 226 136 236 L138 100 Z" fill="#a03028" opacity=".38"/>
  <!-- tiny smear pooled at cap (bottom) -->
  <path d="M88 268 L132 268 L132 282 Q132 288 110 290 Q88 288 88 282 L88 268 Z" fill="#c0150c" opacity=".6"/>
  <!-- shine -->
  <rect x="86" y="100" width="8" height="140" rx="4" fill="#ffffff44"/>

  <!-- ===== LABEL + FACE: UPSIDE DOWN near the bottom (they were on the upright bottle; now inverted) ===== -->
  <!-- Put them inverted just above the cap. In SVG, "upside down text" = rotate 180 -->
  <g transform="translate(110,250) rotate(180)">
    <!-- Label (smaller, faded) -->
    <rect x="-30" y="-40" width="60" height="40" rx="6" fill="#e0c8a8" opacity="0.85"/>
    <text x="0" y="-26" text-anchor="middle" font-family="monospace" font-size="5.5" fill="#8a6a3a">KETCHUP</text>
    <text x="0" y="-12" text-anchor="middle" font-family="serif" font-size="11" font-weight="bold" fill="#6a3a20">Pop</text>
    <text x="0" y="-2" text-anchor="middle" font-family="serif" font-size="5" font-style="italic" fill="#8a6a50">25+ yrs</text>
  </g>

  <!-- Face upside-down just below label (near cap) -->
  <g transform="translate(110,238) rotate(180)">
    <!-- eyes -->
    <circle cx="-12" cy="-8" r="5" fill="#fff" stroke="#3a0501" stroke-width="1.8"/>
    <circle cx="12" cy="-8" r="5" fill="#fff" stroke="#3a0501" stroke-width="1.8"/>
    <circle cx="-10" cy="-7" r="2.5" fill="#3a0501"/>
    <circle cx="14" cy="-7" r="2.5" fill="#3a0501"/>
    <!-- grumpy brows -->
    <path d="M-20 -15 L-10 -12 M-18 -14 L-9 -12" stroke="#3a0501" stroke-width="2" fill="none"/>
    <path d="M20 -15 L10 -12 M18 -14 L9 -12" stroke="#3a0501" stroke-width="2" fill="none"/>
    <!-- frown -->
    <path d="M-12 4 Q0 -1 12 4" stroke="#3a0501" stroke-width="2.2" fill="none"/>
  </g>

  <!-- arms crossed (flipped = near top body) -->
  <g id="kDadArmL"><path d="M80 140 Q66 164 96 180" stroke="#5a0a03" stroke-width="8" stroke-linecap="round" fill="none"/></g>
  <g id="kDadArmR"><path d="M140 140 Q154 164 124 180" stroke="#5a0a03" stroke-width="8" stroke-linecap="round" fill="none"/></g>
</svg>
