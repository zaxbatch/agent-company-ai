<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 330" width="200" height="330">
  <defs>
    <linearGradient id="ketOldRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a0d04"/>
      <stop offset="0.3" stop-color="#96100a"/>
      <stop offset="0.6" stop-color="#b0150c"/>
      <stop offset="1" stop-color="#520801"/>
    </linearGradient>
    <linearGradient id="ketDull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a0703"/>
      <stop offset="0.5" stop-color="#7a0d07"/>
      <stop offset="1" stop-color="#3a0501"/>
    </linearGradient>
  </defs>

  <!-- ===== OLD KETCHUP - UPSIDE DOWN (living on his head) ===== -->
  <!-- The bottle is inverted: cap (nozzle) at BOTTOM, resting on the cap -->
  <!-- nozzle cap at bottom (where he stands on his head) -->
  <rect x="84" y="300" width="32" height="24" rx="5" fill="#8a6a3a"/>
  <rect x="86" y="294" width="28" height="10" rx="3" fill="#a07a40"/>
  <!-- body comes DOWN from shoulders at top (inverted wide body) -->
  <!-- wide body top (this is the bottom of the bottle now at top) -->
  <path d="M82 40 Q82 80 100 80 Q118 80 118 40 Z" fill="url(#ketOldRed)" stroke="#3a0501" stroke-width="2"/>
  <path d="M82 40 L118 40 L112 60 L88 60 Z" fill="url(#ketOldRed)"/>
  <!-- main body descending to nozzle -->
  <path d="M88 80 L112 80 L120 104 L120 250 Q120 290 100 296 Q80 290 80 250 L80 104 Z"
        fill="url(#ketOldRed)" stroke="#3a0501" stroke-width="2"/>
  <!-- ALMOST EMPTY: only a tiny bit of ketchup pooled at the nozzle end (near bottom/cap) -->
  <path d="M86 250 L114 250 L114 284 Q114 290 100 290 Q86 290 86 284 L86 250 Z" fill="#b0150c" opacity=".9"/>
  <!-- rest is dull/dry streaks on the sides -->
  <path d="M84 100 L86 240 Q84 250 84 245 L84 100 Z" fill="#7a0d07" opacity=".5"/>
  <path d="M116 100 L114 240 Q116 250 116 245 L116 100 Z" fill="#7a0d07" opacity=".5"/>

  <!-- ===== LABEL (old, faded, peeling) ===== -->
  <g id="ketOldLabel">
    <rect x="70" y="120" width="60" height="78" rx="4" fill="#e8d8b8"/>
    <!-- faded band -->
    <rect x="70" y="120" width="60" height="12" fill="#8a6a3a"/>
    <text x="100" y="129" text-anchor="middle" font-family="monospace" font-size="7" fill="#e8d8b8">TOMATO</text>
    <text x="100" y="156" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#6a3a20">Ketchup</text>
    <text x="100" y="168" text-anchor="middle" font-family="serif" font-size="7" font-style="italic" fill="#8a6a50">the old star</text>
    <path d="M80 178 L120 178" stroke="#8a6a3a66" stroke-width="1"/>
    <text x="100" y="190" text-anchor="middle" font-family="monospace" font-size="5.5" fill="#8a7a60">ALMOST GONE</text>
    <!-- peeling corner -->
    <path d="M70 190 L74 190 L70 194 Z" fill="#d8c8a8" opacity=".9"/>
  </g>

  <!-- ===== FACE (old, tired, upside-down = his features are nearer the nozzle/bottom) ===== -->
  <!-- eyes UP near his "top" (the bottle bottom curve) but his world is inverted; place face on mid-upper body -->
  <g id="ketOldEyes">
    <ellipse cx="90" cy="70" rx="6" ry="5" fill="#fff" stroke="#3a0501" stroke-width="2"/>
    <ellipse cx="110" cy="70" rx="6" ry="5" fill="#fff" stroke="#3a0501" stroke-width="2"/>
    <circle cx="92" cy="71" r="2.5" fill="#3a0501"/>
    <circle cx="112" cy="71" r="2.5" fill="#3a0501"/>
    <!-- droopy old brows -->
    <path d="M83 62 Q90 59 97 64" stroke="#3a0501" stroke-width="2.2" fill="none"/>
    <path d="M103 64 Q110 59 117 62" stroke="#3a0501" stroke-width="2.2" fill="none"/>
    <!-- wrinkles -->
    <path d="M88 84 L96 83 M104 83 L112 84" stroke="#6a3a20" stroke-width="1.2" opacity=".6"/>
  </g>
  <!-- gasping/coughing mouth (open, tired) -->
  <g id="ketOldMouth">
    <ellipse cx="100" cy="96" rx="8" ry="6" fill="#4a0502"/>
    <path d="M96 92 Q100 88 104 92" stroke="#2a0301" stroke-width="1.5" fill="none"/>
    <!-- a little cough puff -->
    <path d="M100 102 Q100 108 94 110" stroke="#8a7a60" stroke-width="1.2" fill="none" opacity=".7"/>
  </g>

  <!-- ===== ARMS (frail, trembling) ===== -->
  <g id="ketOldArmL"><path d="M84 140 Q60 152 58 176" stroke="#5a0a03" stroke-width="7" stroke-linecap="round" fill="none"/></g>
  <g id="ketOldArmR"><path d="M116 140 Q140 152 142 176" stroke="#5a0a03" stroke-width="7" stroke-linecap="round" fill="none"/></g>

  <!-- ===== a cane (old age) ===== -->
  <g id="ketCane"><line x1="146" y1="176" x2="146" y2="252" stroke="#6a4a20" stroke-width="3.5"/><path d="M142 178 Q146 168 150 178" stroke="#6a4a20" stroke-width="3" fill="none"/></g>

  <!-- ===== cracked shoe (one old sneaker, worn) ===== -->
  <rect x="82" y="290" width="18" height="10" rx="4" fill="#d8d0c8" opacity=".7"/>
  <rect x="100" y="290" width="18" height="10" rx="4" fill="#c8b8a8" opacity=".5"/>
</svg>
