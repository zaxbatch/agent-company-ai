<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 380" width="220" height="380">
  <defs>
    <linearGradient id="kGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c04838" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#e86858" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#f07860" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a03028" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- ===== TALL KETCHUP UPSIDE DOWN (standing on his cap = the long neck points DOWN) ===== -->
  <!-- Body (wide) is at TOP now -->
  <path d="M88 40 Q88 90 110 92 Q132 90 132 40 Z" fill="url(#kGlass)" stroke="#a03028" stroke-width="2.5"/>
  <path d="M88 40 L132 40 L128 70 L92 70 Z" fill="url(#kGlass)" stroke="#a03028" stroke-width="1.5"/>
  <!-- the long narrow neck descends from the body down to the cap at the bottom -->
  <path d="M92 70 L128 70 L124 130 Q124 160 110 160 Q96 160 96 130 L92 70 Z" fill="url(#kGlass)" stroke="#a03028" stroke-width="1.5"/>
  <rect x="98" y="160" width="24" height="120" fill="url(#kGlass)" stroke="#a03028" stroke-width="1.5"/>
  <!-- cap at very bottom -->
  <rect x="96" y="280" width="28" height="18" rx="5" fill="#8a6a3a"/>
  <rect x="98" y="296" width="24" height="7" rx="3" fill="#a07a40"/>

  <!-- translucent: streaks + tiny pool near cap -->
  <path d="M94 84 L92 200 Q92 214 96 224 L94 84 Z" fill="#a03028" opacity=".5"/>
  <path d="M126 84 L128 210 Q128 220 124 230 L126 84 Z" fill="#a03028" opacity=".45"/>
  <!-- last smear pooling at the cap bottom -->
  <path d="M96 270 L124 270 L124 280 Q124 284 110 286 Q96 284 96 280 L96 270 Z" fill="#b0150c" opacity=".8"/>
  <!-- glass shine -->
  <rect x="102" y="60" width="6" height="120" rx="3" fill="#ffffff33"/>
  <rect x="112" y="170" width="4" height="90" rx="2" fill="#ffffff22"/>

  <!-- ===== DAD LABEL (faded, mid body) ===== -->
  <g id="kDadLabel">
    <rect x="80" y="100" width="60" height="66" rx="4" fill="#e0c8a8"/>
    <rect x="80" y="100" width="60" height="12" fill="#8a6a3a"/>
    <text x="110" y="109" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#e8d8b8">KETCHUP</text>
    <text x="110" y="130" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#6a3a20">Pop</text>
    <text x="110" y="143" text-anchor="middle" font-family="serif" font-size="6.5" font-style="italic" fill="#8a6a50">the original</text>
    <text x="110" y="158" text-anchor="middle" font-family="monospace" font-size="5" fill="#a09070">25+ YEARS</text>
  </g>

  <!-- ===== FACE: upright at the BOTTOM (near the cap) — his world flipped but he stays upright ===== -->
  <g id="kDadEyes">
    <ellipse cx="100" cy="248" rx="6.5" ry="5.5" fill="#fff" stroke="#3a0501" stroke-width="2"/>
    <ellipse cx="120" cy="248" rx="6.5" ry="5.5" fill="#fff" stroke="#3a0501" stroke-width="2"/>
    <circle cx="102" cy="249" r="3" fill="#3a0501"/>
    <circle cx="122" cy="249" r="3" fill="#3a0501"/>
    <path d="M92 239 L102 243 M94 238 L103 243" stroke="#3a0501" stroke-width="2.5" fill="none"/>
    <path d="M128 239 L118 243 M126 238 L117 243" stroke="#3a0501" stroke-width="2.5" fill="none"/>
    <path d="M94 256 Q100 258 106 256" stroke="#6a3020" stroke-width="1.2" opacity=".5"/>
    <path d="M114 256 Q120 258 126 256" stroke="#6a3020" stroke-width="1.2" opacity=".5"/>
  </g>
  <g id="kDadMouth">
    <path d="M100 272 Q110 266 120 272" stroke="#3a0501" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- grey stubble -->
  <path d="M100 266 Q110 262 120 266" stroke="#8a8a8a" stroke-width="2" fill="none" opacity=".7"/>

  <!-- arms crossed, bitter -->
  <g id="kDadArmL"><path d="M90 180 Q76 200 102 214" stroke="#5a0a03" stroke-width="8" stroke-linecap="round" fill="none"/></g>
  <g id="kDadArmR"><path d="M130 180 Q144 200 118 214" stroke="#5a0a03" stroke-width="8" stroke-linecap="round" fill="none"/></g>
</svg>
