<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 320" width="220" height="320">
  <defs>
    <!-- translucent glass so you see it's almost empty -->
    <linearGradient id="kGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c04838" stop-opacity="0.4"/>
      <stop offset="0.3" stop-color="#e86858" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#f07860" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a03028" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="kOldRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a0803"/>
      <stop offset="0.5" stop-color="#8a0e05"/>
      <stop offset="1" stop-color="#480502"/>
    </linearGradient>
  </defs>

  <!-- ===== UPSIDE-DOWN KETCHUP BOTTLE (dad) - standing on his cap ===== -->
  <!-- cap/nozzle at BOTTOM -->
  <rect x="96" y="290" width="28" height="20" rx="5" fill="#8a6a3a"/>
  <rect x="98" y="306" width="24" height="8" rx="3" fill="#a07a40"/>

  <!-- TRANSLUCENT body (viewer can see it's almost empty) -->
  <!-- body: wide at top (bottle bottom) tapering to nozzle at bottom -->
  <path d="M84 34 Q84 74 110 76 Q136 74 136 34 Z" fill="url(#kGlass)" stroke="#a03028" stroke-width="2.5"/>
  <path d="M84 34 L136 34 L132 60 L88 60 Z" fill="url(#kGlass)" stroke="#a03028" stroke-width="1.5"/>
  <!-- main inverted body -->
  <path d="M88 76 L132 76 L140 100 L140 250 Q140 282 110 286 Q80 282 80 250 L80 100 Z"
        fill="url(#kGlass)" stroke="#a03028" stroke-width="2.5"/>

  <!-- nearly-empty: a few remaining streaks + tiny pool near nozzle (bottom) -->
  <!-- old dried ketchup streaks on walls (visible through glass) -->
  <path d="M86 90 L84 200 Q84 215 88 222 L86 90 Z" fill="#a03028" opacity=".5"/>
  <path d="M134 90 L136 210 Q136 220 132 228 L134 90 Z" fill="#a03028" opacity=".45"/>
  <!-- thin pool at the nozzle bottom -->
  <path d="M88 250 L132 250 L132 274 Q132 280 110 282 Q88 280 88 274 L88 250 Z" fill="#b0150c" opacity=".85"/>

  <!-- glass shine highlights (empty feel) -->
  <rect x="92" y="80" width="8" height="150" rx="4" fill="#ffffff44"/>
  <rect x="120" y="80" width="4" height="120" rx="2" fill="#ffffff22"/>

  <!-- ===== DAD LABEL (faded, near bottom/right side, peeling) ===== -->
  <g id="kDadLabel">
    <rect x="76" y="120" width="68" height="80" rx="4" fill="#e0c8a8"/>
    <rect x="76" y="120" width="68" height="13" fill="#8a6a3a"/>
    <text x="110" y="130" text-anchor="middle" font-family="monospace" font-size="7" fill="#e8d8b8">KETCHUP</text>
    <text x="110" y="156" text-anchor="middle" font-family="serif" font-size="15" font-weight="bold" fill="#6a3a20">Pop</text>
    <text x="110" y="169" text-anchor="middle" font-family="serif" font-size="7" font-style="italic" fill="#8a6a50">the original</text>
    <text x="110" y="190" text-anchor="middle" font-family="monospace" font-size="5.5" fill="#a09070">HALF USED · 25+ YEARS</text>
    <!-- peeling corner -->
    <path d="M76 190 L82 190 L76 196 Z" fill="#d8c8a8"/>
  </g>

  <!-- ===== FACE: flips so he's upright at the BOTTOM (near nozzle) ===== -->
  <!-- face placed low on the body, near the nozzle end, right-side-up -->
  <g id="kDadEyes">
    <!-- grumpy, tired eyes low on bottle -->
    <ellipse cx="98" cy="210" rx="6.5" ry="5.5" fill="#fff" stroke="#3a0501" stroke-width="2"/>
    <ellipse cx="122" cy="210" rx="6.5" ry="5.5" fill="#fff" stroke="#3a0501" stroke-width="2"/>
    <circle cx="100" cy="211" r="3" fill="#3a0501"/>
    <circle cx="124" cy="211" r="3" fill="#3a0501"/>
    <!-- heavy grumpy brows (slanted down inward) -->
    <path d="M90 201 L100 205 M92 200 L101 205" stroke="#3a0501" stroke-width="2.5" fill="none"/>
    <path d="M130 201 L120 205 M128 200 L119 205" stroke="#3a0501" stroke-width="2.5" fill="none"/>
    <!-- eye bags -->
    <path d="M92 218 Q98 220 104 218" stroke="#6a3020" stroke-width="1.2" fill="none" opacity=".5"/>
    <path d="M116 218 Q122 220 128 218" stroke="#6a3020" stroke-width="1.2" fill="none" opacity=".5"/>
  </g>
  <g id="kDadMouth">
    <!-- bitter downturned mouth -->
    <path d="M98 234 Q110 228 122 234" stroke="#3a0501" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- grey mustache (grumpy dad) -->
  <path d="M98 228 Q110 224 122 228" stroke="#8a8a8a" stroke-width="2" fill="none" opacity=".7"/>

  <!-- ===== ARMS (crossed, bitter) ===== -->
  <g id="kDadArmL"><path d="M84 150 Q70 170 96 184" stroke="#5a0a03" stroke-width="8" stroke-linecap="round" fill="none"/></g>
  <g id="kDadArmR"><path d="M136 150 Q150 170 124 184" stroke="#5a0a03" stroke-width="8" stroke-linecap="round" fill="none"/></g>

  <!-- ===== shoes (he stands on his head so his "feet" are up top? He rests cap-down; give him old slippers near his face end) ===== -->
  <!-- skip shoes - he lives on his head -->
</svg>
