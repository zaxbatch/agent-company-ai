<svg xmlns="http://www.w3.org/2000/svg" id="vinSvg" viewBox="0 0 220 330" width="220" height="310">
  <defs>
    <!-- dark amber vinegar (wine-bottle) -->
    <linearGradient id="vinGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c1f0c"/>
      <stop offset="0.30" stop-color="#8a3a14"/>
      <stop offset="0.55" stop-color="#a34c1a"/>
      <stop offset="0.75" stop-color="#7a2f0e"/>
      <stop offset="1" stop-color="#4a1506"/>
    </linearGradient>
    <radialGradient id="vinPunt" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a0d04"/>
      <stop offset="1" stop-color="#5c1f0c"/>
    </radialGradient>
  </defs>

  <!-- ===== WINE BOTTLE BODY ===== -->
  <!-- tall slender: wide base w/ punt, straight sides, curved shoulder into long neck -->
  <path d="M78 122 L142 122 L142 255 Q142 280 110 288 Q78 280 78 255 Z"
        fill="url(#vinGlass)" stroke="#2a0d04" stroke-width="3"/>
  <!-- shoulder curve into neck -->
  <path d="M78 122 Q78 96 92 88 L92 122 Z" fill="url(#vinGlass)"/>
  <path d="M142 122 Q142 96 128 88 L128 122 Z" fill="url(#vinGlass)"/>
  <!-- long neck -->
  <rect x="92" y="52" width="36" height="40" fill="url(#vinGlass)" stroke="#2a0d04" stroke-width="2"/>
  <!-- glass highlight -->
  <rect x="88" y="130" width="12" height="120" rx="6" fill="#ffffff18"/>
  <!-- punt (bottom dimple) -->
  <ellipse cx="110" cy="286" rx="22" ry="6" fill="url(#vinPunt)"/>

  <!-- ===== NECK BAND / LABEL ===== -->
  <!-- foil cap top -->
  <rect x="88" y="34" width="44" height="18" rx="4" fill="#1c0f06"/>
  <rect x="90" y="30" width="40" height="8" rx="3" fill="#b8860b"/>
  <!-- main label: THE REALEST -->
  <g>
    <rect x="68" y="158" width="84" height="72" rx="4" fill="#f5e6d0" stroke="#8a4a12" stroke-width="3"/>
    <rect x="72" y="162" width="76" height="18" fill="#8a4a12"/>
    <text x="110" y="175" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#f5e6d0">VIN NEGAR</text>
    <text x="110" y="196" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#5c1f0c">THE REALEST</text>
    <text x="110" y="211" text-anchor="middle" font-family="monospace" font-size="7" fill="#8a4a12">vinegar you know</text>
    <text x="110" y="224" text-anchor="middle" font-family="monospace" font-size="7" fill="#5c1f0c">est. the cab-nets</text>
  </g>

  <!-- ===== CUBAN-LINK GOLD CHAIN (distinct: heavy cuban) ===== -->
  <g id="vinChain">
    <path d="M76 130 Q110 164 144 130" stroke="#ffd700" stroke-width="5" fill="none"/>
    <!-- cuban links -->
    <path d="M80 133 Q86 142 92 138" stroke="#ffd700" stroke-width="3" fill="none"/>
    <path d="M128 133 Q134 142 140 138" stroke="#ffd700" stroke-width="3" fill="none"/>
    <circle cx="110" cy="150" r="13" fill="#111" stroke="#ffd700" stroke-width="4"/>
    <text x="110" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffd700">V</text>
  </g>

  <!-- ===== FACE ===== -->
  <!-- face sits on the neck/shoulder zone -->
  <!-- sunglasses (keep, darker) -->
  <g id="vinShades">
    <path d="M86 78 Q110 70 134 78 L132 90 Q110 82 88 90 Z" fill="#0a0a0a"/>
    <rect x="84" y="76" width="22" height="15" rx="4" fill="#0a0a0a" stroke="#ffd700" stroke-width="2"/>
    <rect x="114" y="76" width="22" height="15" rx="4" fill="#0a0a0a" stroke="#ffd700" stroke-width="2"/>
    <path d="M106 82 L114 82" stroke="#ffd700" stroke-width="2"/>
  </g>
  <!-- mouth (lip-sync) -->
  <g id="vinMouth">
    <path d="M100 104 Q110 113 120 104" stroke="#1c0f06" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== ARMS (bottle-guy in leather-ish) ===== -->
  <g id="vinArmL">
    <path d="M78 200 Q52 216 56 244" stroke="#1c0f06" stroke-width="11" stroke-linecap="round" fill="none"/>
  </g>
  <g id="vinArmR">
    <path d="M142 200 Q168 216 164 244" stroke="#1c0f06" stroke-width="11" stroke-linecap="round" fill="none"/>
  </g>
  <!-- shoes -->
  <rect x="80" y="286" width="26" height="12" rx="5" fill="#0a0a0a"/>
  <rect x="114" y="286" width="26" height="12" rx="5" fill="#0a0a0a"/>
</svg>
