<svg xmlns="http://www.w3.org/2000/svg" id="vinSvg" viewBox="0 0 220 330" width="220" height="310">
  <defs>
    <linearGradient id="vinGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f1806"/>
      <stop offset="0.3" stop-color="#6e2608"/>
      <stop offset="0.5" stop-color="#7e2e0a"/>
      <stop offset="1" stop-color="#3a1003"/>
    </linearGradient>
  </defs>

  <!-- ===== WINE BOTTLE, one-piece glass ===== -->
  <rect x="90" y="24" width="40" height="13" rx="3" fill="#3a1a08"/>
  <rect x="92" y="20" width="36" height="7" rx="3" fill="#c9a04a"/>
  <path d="M92 40 L128 40 L128 78 Q128 94 140 106 L142 118 L142 246 Q142 272 110 282 Q78 272 78 246 L78 118 L80 106 Q92 94 92 78 Z"
        fill="url(#vinGlass)" stroke="#200a02" stroke-width="2.5"/>
  <rect x="86" y="122" width="8" height="120" rx="4" fill="#ffffff10"/>

  <!-- FACE (shades + mouth) on glass -->
  <g id="vinShades">
    <rect x="86" y="62" width="21" height="14" rx="4" fill="#0b0b0b" stroke="#e8c15a" stroke-width="2"/>
    <rect x="113" y="62" width="21" height="14" rx="4" fill="#0b0b0b" stroke="#e8c15a" stroke-width="2"/>
    <path d="M107 68 L113 68" stroke="#e8c15a" stroke-width="2"/>
    <path d="M86 68 L76 63 M134 68 L144 63" stroke="#1f0a02" stroke-width="3"/>
  </g>
  <g id="vinMouth">
    <path d="M100 88 Q110 97 120 88" stroke="#160a02" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== LABEL: glass-edge occlusion (reads as wrapping around) ===== -->
  <g id="vinLabelWrap">
    <rect x="64" y="148" width="92" height="88" rx="4" fill="#f7ead0"/>
    <rect x="71" y="156" width="78" height="17" fill="#5a1803"/>
    <text x="110" y="169" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#ffe8d0">VIN NEGAR</text>
    <text x="110" y="194" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#4a1604">THE REALEST</text>
    <text x="110" y="209" text-anchor="middle" font-family="monospace" font-size="8" fill="#7e4a24">vinegar you know</text>
    <text x="110" y="226" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#5a2a12">est. the cab-nets · 100% no cap</text>
    <!-- glass curvature over label edges -->
    <rect x="64" y="148" width="12" height="88" rx="4" fill="#200a02" opacity=".5"/>
    <rect x="144" y="148" width="12" height="88" rx="4" fill="#200a02" opacity=".5"/>
    <rect x="74" y="148" width="4" height="88" fill="#200a02" opacity=".16"/>
    <rect x="142" y="148" width="4" height="88" fill="#200a02" opacity=".16"/>
    <!-- gloss -->
    <rect x="90" y="148" width="10" height="88" fill="#ffffff" opacity=".2"/>
  </g>

  <!-- cuban chain -->
  <g id="vinChain">
    <path d="M76 130 Q110 162 144 130" stroke="#ffd700" stroke-width="5" fill="none"/>
    <path d="M84 136 L92 147 M92 139 L99 145 M128 136 L136 147 M121 139 L128 145" stroke="#ffd700" stroke-width="2.4"/>
    <circle cx="110" cy="150" r="12" fill="#111" stroke="#ffd700" stroke-width="3.5"/>
    <text x="110" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffd700">V</text>
  </g>

  <g id="vinArmL"><path d="M78 200 Q50 216 56 244" stroke="#1c0f06" stroke-width="11" stroke-linecap="round" fill="none"/></g>
  <g id="vinArmR"><path d="M142 200 Q170 216 164 244" stroke="#1c0f06" stroke-width="11" stroke-linecap="round" fill="none"/></g>
  <rect x="82" y="280" width="26" height="11" rx="5" fill="#0a0a0a"/>
  <rect x="112" y="280" width="26" height="11" rx="5" fill="#0a0a0a"/>
</svg>
