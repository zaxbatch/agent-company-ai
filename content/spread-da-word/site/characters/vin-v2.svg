<svg xmlns="http://www.w3.org/2000/svg" id="vinSvg" viewBox="0 0 220 330" width="220" height="310">
  <defs>
    <linearGradient id="vinGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f1806"/>
      <stop offset="0.3" stop-color="#6e2608"/>
      <stop offset="0.5" stop-color="#7e2e0a"/>
      <stop offset="1" stop-color="#3a1003"/>
    </linearGradient>
  </defs>

  <!-- ===== WINE BOTTLE — flat bottom ===== -->
  <!-- foil cap -->
  <rect x="90" y="24" width="40" height="13" rx="3" fill="#3a1a08"/>
  <rect x="92" y="20" width="36" height="7" rx="3" fill="#c9a04a"/>
  <!-- body: neck, shoulder, straight sides, FLAT bottom -->
  <path d="M92 40 L128 40 L128 78 Q128 94 140 106 L142 118 L142 252 Q142 260 135 262 L85 262 Q78 260 78 252 L78 118 L80 106 Q92 94 92 78 Z"
        fill="url(#vinGlass)" stroke="#200a02" stroke-width="2.5"/>
  <!-- subtle bottom flat highlight -->
  <rect x="84" y="258" width="52" height="3" rx="1.5" fill="#200a02" opacity=".4"/>

  <!-- ===== FACE ===== -->
  <g id="vinShades">
    <rect x="86" y="62" width="21" height="14" rx="4" fill="#0b0b0b" stroke="#e8c15a" stroke-width="2"/>
    <rect x="113" y="62" width="21" height="14" rx="4" fill="#0b0b0b" stroke="#e8c15a" stroke-width="2"/>
    <path d="M107 68 L113 68" stroke="#e8c15a" stroke-width="2"/>
    <path d="M86 68 L76 63 M134 68 L144 63" stroke="#1f0a02" stroke-width="3"/>
  </g>
  <g id="vinMouth">
    <path d="M100 90 Q110 99 120 90" stroke="#160a02" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== LABEL — CONTAINED inside the bottle (no overhang = no bib) ===== -->
  <g id="vinLabelWrap">
    <!-- label body well inside bottle sides (82..138; bottle is 78..142) -->
    <rect x="83" y="160" width="54" height="62" rx="3" fill="#f7ead0"/>
    <rect x="88" y="166" width="44" height="13" fill="#5a1803"/>
    <text x="110" y="176" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#ffe8d0">VIN NEGAR</text>
    <text x="110" y="193" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#4a1604" letter-spacing="0.5">REALEST</text>
    <text x="110" y="204" text-anchor="middle" font-family="monospace" font-size="5.5" fill="#7e4a24">real vinegar</text>
    <text x="110" y="214" text-anchor="middle" font-family="monospace" font-size="6" fill="#5a2a12">est. cab-nets</text>
    <!-- cylinder wrap cues (thin, INSIDE the label) -->
    <rect x="83" y="160" width="6" height="62" fill="#200a02" opacity=".35"/>
    <rect x="131" y="160" width="6" height="62" fill="#200a02" opacity=".35"/>
    <rect x="102" y="160" width="5" height="62" fill="#ffffff" opacity=".18"/>
  </g>

  <!-- ===== CUBAN CHAIN (below label) ===== -->
  <g id="vinChain">
    <path d="M86 146 Q110 170 134 146" stroke="#ffd700" stroke-width="4" fill="none"/>
    <circle cx="110" cy="160" r="8" fill="#111" stroke="#ffd700" stroke-width="3"/>
    <text x="110" y="164" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#ffd700">V</text>
  </g>

  <g id="vinArmL"><path d="M80 118 Q52 148 48 188" stroke="#1c0f06" stroke-width="10" stroke-linecap="round" fill="none"/></g>
  <g id="vinArmR"><path d="M140 118 Q168 148 172 188" stroke="#1c0f06" stroke-width="10" stroke-linecap="round" fill="none"/></g>
  <rect x="84" y="260" width="24" height="10" rx="4" fill="#0a0a0a"/>
  <rect x="112" y="260" width="24" height="10" rx="4" fill="#0a0a0a"/>
</svg>
