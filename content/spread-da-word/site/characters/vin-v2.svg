<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 320" width="220" height="320">
  <defs>
    <!-- amber vinegar liquid gradient -->
    <linearGradient id="vinGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a05a1c"/>
      <stop offset="0.35" stop-color="#d98a3d"/>
      <stop offset="0.55" stop-color="#e8a95c"/>
      <stop offset="1" stop-color="#8a4a12"/>
    </linearGradient>
    <linearGradient id="vinGlassEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e3a0e"/>
      <stop offset="1" stop-color="#6e3a0e"/>
    </linearGradient>
  </defs>

  <!-- ===== BOTTLE BODY (tall vinegar bottle) ===== -->
  <!-- shoulders/neck shape: straight tall sides, slight shoulder, neck, flared lip -->
  <!-- main body -->
  <path d="M70 95 L150 95 L152 120 L152 250 Q152 268 110 268 Q68 268 68 250 L68 120 Z"
        fill="url(#vinGlass)" stroke="#5a3008" stroke-width="3"/>
  <!-- inner light highlight -->
  <rect x="84" y="108" width="16" height="130" rx="8" fill="#ffffff22"/>
  <!-- label band -->
  <rect x="68" y="150" width="84" height="58" fill="#1c0f06" stroke="#d9a05c" stroke-width="2"/>
  <text x="110" y="176" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#f0c060">VIN</text>
  <text x="110" y="192" text-anchor="middle" font-family="monospace" font-size="7" fill="#d9a05c">NEGAR</text>
  <text x="110" y="202" text-anchor="middle" font-family="monospace" font-size="6" fill="#8a6a3a">apple cider</text>

  <!-- ===== GOLD CHAIN (keep!) ===== -->
  <g id="vinChain">
    <path d="M74 134 Q110 160 146 134" stroke="#ffd700" stroke-width="4" fill="none"/>
    <circle cx="110" cy="152" r="11" fill="none" stroke="#ffd700" stroke-width="4"/>
    <text x="110" y="157" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffd700">V</text>
  </g>

  <!-- ===== HEAD / FACE sits above the bottle neck ===== -->
  <!-- Vin is a bottle; his 'face' is on the upper bottle / neck area -->
  <!-- neck + cap (like a bottle top = head) -->
  <path d="M88 66 L132 66 L134 95 L86 95 Z" fill="#2a1a10"/>
  <!-- black cap -->
  <rect x="82" y="48" width="56" height="24" rx="6" fill="#0d0d0d" stroke="#333" stroke-width="2"/>
  <rect x="82" y="56" width="56" height="6" fill="#222"/>

  <!-- ===== SUNGLASSES (keep!) on the neck/face area ===== -->
  <g id="vinShades">
    <rect x="84" y="72" width="20" height="14" rx="3" fill="#111" stroke="#ffd700" stroke-width="2"/>
    <rect x="116" y="72" width="20" height="14" rx="3" fill="#111" stroke="#ffd700" stroke-width="2"/>
    <path d="M104 79 L116 79" stroke="#ffd700" stroke-width="2"/>
    <path d="M84 79 L74 74 M136 79 L146 74" stroke="#111" stroke-width="3"/>
  </g>

  <!-- ===== MOUTH (animated) ===== -->
  <g id="vinMouth">
    <path d="M98 100 Q110 110 122 100" stroke="#3a1a0a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== ARMS ===== -->
  <g id="vinArmL">
    <path d="M68 150 Q40 170 44 200" stroke="#5a3008" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>
  <g id="vinArmR">
    <path d="M152 150 Q180 170 176 200" stroke="#5a3008" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>

  <!-- feet/shoes -->
  <rect x="80" y="268" width="30" height="14" rx="4" fill="#222"/>
  <rect x="112" y="268" width="30" height="14" rx="4" fill="#222"/>
</svg>
