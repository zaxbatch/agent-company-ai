<svg xmlns="http://www.w3.org/2000/svg" id="vinSvg" viewBox="0 0 220 330" width="220" height="310">
  <defs>
    <!-- ONE continuous dark-amber glass (no separate neck color) -->
    <linearGradient id="vinGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c1f0c"/>
      <stop offset="0.28" stop-color="#7a2f0e"/>
      <stop offset="0.5" stop-color="#8f3a12"/>
      <stop offset="0.72" stop-color="#6e2608"/>
      <stop offset="1" stop-color="#431404"/>
    </linearGradient>
    <!-- wrap-around label: dark edges, light centre (cylinder illusion) -->
    <linearGradient id="vinLabel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9b28a"/>
      <stop offset="0.18" stop-color="#f7ecd6"/>
      <stop offset="0.5" stop-color="#fff7e6"/>
      <stop offset="0.82" stop-color="#f0e2c4"/>
      <stop offset="1" stop-color="#b49c72"/>
    </linearGradient>
  </defs>

  <!-- ===== ONE-PIECE WINE BOTTLE (glass continuous) ===== -->
  <!-- foil cap -->
  <rect x="90" y="26" width="40" height="14" rx="3" fill="#3a1a08"/>
  <rect x="92" y="22" width="36" height="7" rx="3" fill="#c9a04a"/>
  <!-- neck -> shoulder -> body -> punt, all same glass -->
  <path d="M92 40 L128 40 L128 76 Q128 92 140 104 L142 116 L142 246 Q142 272 110 282 Q78 272 78 246 L78 116 L80 104 Q92 92 92 76 Z"
        fill="url(#vinGlass)" stroke="#2a0d04" stroke-width="2.5"/>
  <!-- glass highlight -->
  <path d="M96 48 L104 48 L104 74 Q104 88 96 100 L94 100 Q88 88 88 74 L88 48 Z" fill="#ffffff14"/>
  <rect x="88" y="120" width="8" height="120" rx="4" fill="#ffffff12"/>

  <!-- ===== FACE on the glass shoulder (continuous color, no odd band) ===== -->
  <!-- shades (kept) -->
  <g id="vinShades">
    <rect x="86" y="64" width="21" height="15" rx="4" fill="#0b0b0b" stroke="#e8c15a" stroke-width="2"/>
    <rect x="113" y="64" width="21" height="15" rx="4" fill="#0b0b0b" stroke="#e8c15a" stroke-width="2"/>
    <path d="M107 70 L113 70" stroke="#e8c15a" stroke-width="2"/>
    <path d="M86 70 L76 66 M134 70 L144 66" stroke="#3a1a08" stroke-width="3"/>
  </g>
  <!-- mouth (lip-sync) -->
  <g id="vinMouth">
    <path d="M100 90 Q110 99 120 90" stroke="#1c0f06" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== WRAP-AROUND LABEL (curved sides + edge shading = looks like it wraps) ===== -->
  <g id="vinLabelWrap">
    <!-- front label with wrapped edges -->
    <rect x="64" y="150" width="92" height="86" rx="8" fill="url(#vinLabel)" stroke="#7a4a14" stroke-width="2.5"/>
    <!-- side wrap bands (right/left edge, darker) -->
    <rect x="64" y="150" width="9" height="86" rx="4" fill="#5c3a10" opacity=".5"/>
    <rect x="147" y="150" width="9" height="86" rx="4" fill="#5c3a10" opacity=".5"/>
    <!-- top wrap hint -->
    <rect x="64" y="150" width="92" height="7" rx="4" fill="#5c3a10" opacity=".35"/>
    <!-- label text -->
    <rect x="72" y="158" width="76" height="17" fill="#7a3010"/>
    <text x="110" y="171" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#f5e6d0">VIN NEGAR</text>
    <text x="110" y="195" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#5c1f0c">THE REALEST</text>
    <text x="110" y="210" text-anchor="middle" font-family="monospace" font-size="8" fill="#8a4a12">vinegar you know</text>
    <text x="110" y="226" text-anchor="middle" font-family="monospace" font-size="8" fill="#5c1f0c">est. the cab-nets · 100% no cap</text>
  </g>

  <!-- ===== CUBAN-LINK CHAIN ===== -->
  <g id="vinChain">
    <path d="M76 132 Q110 166 144 132" stroke="#ffd700" stroke-width="5" fill="none"/>
    <path d="M82 137 L90 148 M90 140 L97 146 M130 137 L138 148 M123 140 L130 146" stroke="#ffd700" stroke-width="2.5"/>
    <circle cx="110" cy="152" r="12" fill="#111" stroke="#ffd700" stroke-width="3.5"/>
    <text x="110" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffd700">V</text>
  </g>

  <!-- arms -->
  <g id="vinArmL"><path d="M78 200 Q50 216 56 244" stroke="#1c0f06" stroke-width="11" stroke-linecap="round" fill="none"/></g>
  <g id="vinArmR"><path d="M142 200 Q170 216 164 244" stroke="#1c0f06" stroke-width="11" stroke-linecap="round" fill="none"/></g>
  <!-- shoes -->
  <rect x="82" y="280" width="26" height="11" rx="5" fill="#0a0a0a"/>
  <rect x="112" y="280" width="26" height="11" rx="5" fill="#0a0a0a"/>
</svg>
