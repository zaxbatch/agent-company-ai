<svg xmlns="http://www.w3.org/2000/svg" id="queSvg" viewBox="0 0 220 330" width="220" height="310">
  <defs>
    <!-- ONE continuous sauce-red (body+neck same) -->
    <linearGradient id="queBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a1203"/>
      <stop offset="0.3" stop-color="#7a2005"/>
      <stop offset="0.52" stop-color="#8c2807"/>
      <stop offset="0.75" stop-color="#6e1a04"/>
      <stop offset="1" stop-color="#420c02"/>
    </linearGradient>
    <linearGradient id="queLabel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9bc90"/>
      <stop offset="0.18" stop-color="#f9ecd6"/>
      <stop offset="0.5" stop-color="#fff6e4"/>
      <stop offset="0.82" stop-color="#f0e0c0"/>
      <stop offset="1" stop-color="#c0a270"/>
    </linearGradient>
  </defs>

  <!-- ===== SQUEEZE/RANCH BOTTLE, one continuous color ===== -->
  <!-- flip cap -->
  <path d="M98 54 L122 54 L121 62 L99 62 Z" fill="#e04040"/>
  <rect x="100" y="49" width="20" height="6" rx="2" fill="#b83232"/>
  <!-- neck, ridged shoulders, body — all same sauce-red -->
  <path d="M88 62 L132 62 L132 96 L146 116 L146 240 Q146 264 110 264 Q74 264 74 240 L74 116 L88 96 Z"
        fill="url(#queBody)" stroke="#2a0a01" stroke-width="2.5"/>
  <!-- ridges at neck base -->
  <rect x="84" y="92" width="52" height="5" fill="#5a1203"/>
  <rect x="82" y="99" width="56" height="4" fill="#5a1203"/>
  <rect x="80" y="105" width="60" height="4" fill="#6e1a04"/>
  <!-- highlight -->
  <rect x="84" y="120" width="8" height="110" rx="4" fill="#ffffff12"/>

  <!-- ===== FACE on upper body over same continuous color ===== -->
  <!-- beanie (distinct, tilted) -->
  <g id="queCap">
    <path d="M80 52 Q110 30 142 52 L138 62 L82 62 Z" fill="#2a1a10"/>
    <path d="M80 52 Q70 56 68 64 Q76 60 84 60 Z" fill="#1a0c04"/>
  </g>
  <!-- eyes -->
  <g id="queEyes">
    <circle cx="97" cy="78" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="123" cy="78" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="99" cy="79" r="3.5" fill="#111"/>
    <circle cx="125" cy="79" r="3.5" fill="#111"/>
  </g>
  <!-- mouth big grin + gold tooth -->
  <g id="queMouth">
    <path d="M94 98 Q110 112 126 98" stroke="#2a0a01" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <rect x="107" y="99" width="7" height="7" rx="1.5" fill="#ffd700" transform="rotate(8 110 102)"/>
  </g>

  <!-- ===== WRAP-AROUND LABEL ===== -->
  <g id="queLabelWrap">
    <rect x="60" y="152" width="100" height="78" rx="8" fill="url(#queLabel)" stroke="#7a3010" stroke-width="2.5"/>
    <rect x="60" y="152" width="10" height="78" rx="4" fill="#5c2a10" opacity=".5"/>
    <rect x="150" y="152" width="10" height="78" rx="4" fill="#5c2a10" opacity=".5"/>
    <rect x="60" y="152" width="100" height="7" rx="4" fill="#5c2a10" opacity=".35"/>
    <rect x="68" y="161" width="84" height="17" fill="#7a2404"/>
    <text x="110" y="174" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#f5e6d0">QUE'S</text>
    <text x="110" y="196" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#6b2a08">BBQ SAUCE</text>
    <text x="110" y="211" text-anchor="middle" font-family="monospace" font-size="8" fill="#8a2f14">smoky · sweet · pass the vibe</text>
  </g>

  <!-- ===== FIGARO CHAIN + FLAME PENDANT ===== -->
  <g id="queChain">
    <path d="M78 128 Q110 158 142 128" stroke="#ffd700" stroke-width="5" fill="none"/>
    <path d="M86 133 L92 143 M92 136 L98 141 M128 133 L134 143 M122 136 L128 141" stroke="#ffd700" stroke-width="2"/>
    <path d="M110 144 l-7 15 a7 7 0 0 0 14 0 Z" fill="#ff8a3d" stroke="#ffd700" stroke-width="1.5"/>
  </g>

  <!-- arms -->
  <g id="queArmL"><path d="M74 200 Q46 216 52 244" stroke="#7a2005" stroke-width="12" stroke-linecap="round" fill="none"/></g>
  <g id="queArmR"><path d="M146 200 Q174 216 168 244" stroke="#7a2005" stroke-width="12" stroke-linecap="round" fill="none"/></g>
  <!-- sneakers -->
  <rect x="78" y="264" width="30" height="12" rx="5" fill="#0a0a0a"/>
  <rect x="112" y="264" width="30" height="12" rx="5" fill="#0a0a0a"/>
</svg>
