<svg xmlns="http://www.w3.org/2000/svg" id="queSvg" viewBox="0 0 220 330" width="220" height="310">
  <defs>
    <linearGradient id="queGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a1203"/>
      <stop offset="0.3" stop-color="#7a2508"/>
      <stop offset="0.55" stop-color="#8f3010"/>
      <stop offset="1" stop-color="#3a0d02"/>
    </linearGradient>
    <linearGradient id="queSqueeze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c25e2b"/>
      <stop offset="0.5" stop-color="#e0783a"/>
      <stop offset="1" stop-color="#a04a1c"/>
    </linearGradient>
  </defs>

  <!-- ===== RANCH/BBQ SQUEEZE BOTTLE ===== -->
  <!-- wide stable base, taper up to a long narrow neck + flip cap -->
  <!-- body -->
  <path d="M62 168 L158 168 L158 238 Q158 262 110 262 Q62 262 62 238 Z"
        fill="url(#queGlass)" stroke="#2a0a01" stroke-width="3"/>
  <!-- squeeze shoulders taper up to narrow neck -->
  <path d="M62 168 Q62 130 88 116 L88 168 Z" fill="url(#queGlass)"/>
  <path d="M158 168 Q158 130 132 116 L132 168 Z" fill="url(#queGlass)"/>
  <!-- long narrow neck -->
  <rect x="88" y="70" width="44" height="52" fill="url(#queSqueeze)" stroke="#2a0a01" stroke-width="2"/>
  <!-- squeezable ridged section -->
  <g id="queRidges">
    <rect x="88" y="120" width="44" height="5" fill="#a04a1c"/>
    <rect x="88" y="112" width="44" height="4" fill="#a04a1c"/>
    <rect x="88" y="104" width="44" height="4" fill="#a04a1c"/>
  </g>
  <!-- flip cap -->
  <path d="M96 62 L124 62 L122 70 L98 70 Z" fill="#c0392b"/>
  <rect x="98" y="58" width="24" height="6" rx="2" fill="#e74c3c"/>

  <!-- ===== LABEL (label wraps body) ===== -->
  <g>
    <rect x="62" y="180" width="96" height="52" rx="5" fill="#f5e6d0" stroke="#8a2f14" stroke-width="3"/>
    <rect x="66" y="184" width="88" height="16" fill="#8a2f14"/>
    <text x="110" y="196" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#f5e6d0">QUE'S</text>
    <text x="110" y="214" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#6b2a08">BBQ SAUCE</text>
    <text x="110" y="226" text-anchor="middle" font-family="monospace" font-size="7" fill="#8a2f14">pass the vibe</text>
  </g>

  <!-- ===== DISTINCT CHAIN: chunky figaro link + flame pendant ===== -->
  <g id="queChain">
    <path d="M78 140 Q110 168 142 140" stroke="#ffd700" stroke-width="6" fill="none"/>
    <path d="M84 143 L90 152 M90 145 L96 150 M136 143 L142 152 M130 145 L136 150" stroke="#ffd700" stroke-width="2"/>
    <path d="M110 156 l-6 14 a6 6 0 0 0 12 0 Z" fill="#ffd700"/>  <!-- flame-ish pendant -->
  </g>

  <!-- ===== HEAD: beanie + face on neck/shoulder area ===== -->
  <!-- do-rag/beanie (distinct, tilted) -->
  <g id="queCap">
    <path d="M78 84 Q110 60 142 84 L140 94 L80 94 Z" fill="#2a1a10"/>
    <path d="M78 84 Q66 88 64 96 Q74 90 80 92 Z" fill="#1a0c04"/>
    <path d="M98 68 L122 68 L118 58 L102 58 Z" fill="#1a0c04" transform="rotate(-12 110 63)"/>
  </g>
  <!-- eyes friendly -->
  <g id="queEyes">
    <circle cx="97" cy="102" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="123" cy="102" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="99" cy="103" r="3.5" fill="#111"/>
    <circle cx="125" cy="103" r="3.5" fill="#111"/>
  </g>
  <!-- mouth: big grin + gold tooth -->
  <g id="queMouth">
    <path d="M94 124 Q110 138 126 124" stroke="#2a0a01" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <rect x="107" y="125" width="7" height="7" rx="1.5" fill="#ffd700" transform="rotate(8 110 128)"/>
  </g>

  <!-- arms -->
  <g id="queArmL">
    <path d="M60 190 Q34 210 38 240" stroke="#8a2f14" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>
  <g id="queArmR">
    <path d="M160 190 Q186 210 182 240" stroke="#8a2f14" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>
  <!-- sneakers -->
  <rect x="78" y="262" width="32" height="14" rx="5" fill="#0a0a0a"/>
  <rect x="112" y="262" width="32" height="14" rx="5" fill="#0a0a0a"/>
</svg>
