<svg xmlns="http://www.w3.org/2000/svg" id="queSvg" viewBox="0 0 220 330" width="220" height="310">
  <defs>
    <linearGradient id="queBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d0f02"/>
      <stop offset="0.3" stop-color="#6e1c04"/>
      <stop offset="0.5" stop-color="#7e2406"/>
      <stop offset="1" stop-color="#3a0a01"/>
    </linearGradient>
  </defs>

  <!-- ===== RANCH/BBQ SQUEEZE BOTTLE ===== -->
  <!-- flip cap -->
  <path d="M96 52 L124 52 L123 60 L97 60 Z" fill="#e04040"/>
  <rect x="98" y="48" width="24" height="5" rx="2" fill="#b83232"/>
  <!-- long clean neck (NO ridges = no pillow) -->
  <rect x="92" y="60" width="36" height="56" fill="url(#queBody)" stroke="#2a0a01" stroke-width="2"/>
  <!-- shoulders taper -->
  <path d="M80 116 L140 116 L158 214 L158 250 Q158 264 110 264 Q62 264 62 250 L62 214 Z"
        fill="url(#queBody)" stroke="#2a0a01" stroke-width="2.5"/>
  <path d="M80 116 Q80 98 92 94 L92 116 Z" fill="url(#queBody)"/>
  <path d="M140 116 Q140 98 128 94 L128 116 Z" fill="url(#queBody)"/>
  <!-- gloss -->
  <rect x="70" y="176" width="5" height="60" rx="2.5" fill="#ffffff14"/>

  <!-- ===== FACE: sits on the UPPER BODY (shoulder), below the neck ===== -->
  <!-- beanie sits right on top -->
  <g id="queCap">
    <path d="M86 96 Q110 80 134 96 L132 108 L88 108 Z" fill="#2a1a10"/>
    <path d="M86 96 Q80 100 78 108 Q86 103 90 104 Z" fill="#160a02"/>
  </g>
  <!-- eyes on the body -->
  <g id="queEyes">
    <circle cx="98" cy="126" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="122" cy="126" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="100" cy="127" r="3.5" fill="#111"/>
    <circle cx="124" cy="127" r="3.5" fill="#111"/>
  </g>
  <!-- mouth -->
  <g id="queMouth">
    <path d="M95 146 Q110 159 125 146" stroke="#1f0500" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <rect x="108" y="147" width="7" height="7" rx="1.5" fill="#ffd700"/>
  </g>

  <!-- ===== LABEL (fits body, clean) ===== -->
  <g id="queLabelWrap">
    <rect x="62" y="166" width="96" height="62" rx="4" fill="#f7ead0"/>
    <rect x="68" y="172" width="84" height="15" fill="#6e1c04"/>
    <text x="110" y="184" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#ffe8d0">QUE'S</text>
    <text x="110" y="202" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#5a1803">BBQ SAUCE</text>
    <text x="110" y="215" text-anchor="middle" font-family="monospace" font-size="7" fill="#7e4a24">pass the vibe</text>
    <!-- wrap shading -->
    <rect x="62" y="166" width="11" height="62" rx="4" fill="#1f0500" opacity=".5"/>
    <rect x="147" y="166" width="11" height="62" rx="4" fill="#1f0500" opacity=".5"/>
    <rect x="72" y="166" width="4" height="62" fill="#1f0500" opacity=".15"/>
    <rect x="144" y="166" width="4" height="62" fill="#1f0500" opacity=".15"/>
  </g>

  <!-- chain -->
  <g id="queChain">
    <path d="M84 152 Q110 176 136 152" stroke="#ffd700" stroke-width="5" fill="none"/>
    <path d="M110 162 l-6 12 a6 6 0 0 0 12 0 Z" fill="#ff8a3d" stroke="#ffd700" stroke-width="1.5"/>
  </g>

  <g id="queArmL"><path d="M62 205 Q36 220 42 246" stroke="#5a1603" stroke-width="12" stroke-linecap="round" fill="none"/></g>
  <g id="queArmR"><path d="M158 205 Q184 220 178 246" stroke="#5a1603" stroke-width="12" stroke-linecap="round" fill="none"/></g>
  <rect x="78" y="262" width="30" height="12" rx="5" fill="#0a0a0a"/>
  <rect x="112" y="262" width="30" height="12" rx="5" fill="#0a0a0a"/>
</svg>
