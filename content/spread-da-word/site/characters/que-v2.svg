<svg xmlns="http://www.w3.org/2000/svg" id="queSvg" viewBox="0 0 220 330" width="220" height="310">
  <defs>
    <linearGradient id="queBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d0f02"/>
      <stop offset="0.3" stop-color="#6e1c04"/>
      <stop offset="0.5" stop-color="#7e2406"/>
      <stop offset="1" stop-color="#3a0a01"/>
    </linearGradient>
  </defs>

  <!-- ===== RANCH/BBQ SQUEEZE BOTTLE (v3 shape: long narrow neck + ridges + flip cap) ===== -->
  <!-- flip cap -->
  <path d="M96 52 L124 52 L123 62 L97 62 Z" fill="#e04040"/>
  <rect x="98" y="47" width="24" height="6" rx="2" fill="#b83232"/>
  <!-- long narrow neck -->
  <rect x="92" y="62" width="36" height="42" fill="url(#queBody)" stroke="#2a0a01" stroke-width="2"/>
  <!-- ridges (squeeze grip) -->
  <rect x="88" y="98" width="44" height="5" fill="#1f0500" opacity=".55"/>
  <rect x="88" y="105" width="44" height="4" fill="#1f0500" opacity=".55"/>
  <rect x="90" y="111" width="40" height="4" fill="#1f0500" opacity=".55"/>
  <!-- wide body, tapers up into neck -->
  <path d="M80 118 L140 118 L158 210 L158 250 Q158 264 110 264 Q62 264 62 250 L62 210 Z"
        fill="url(#queBody)" stroke="#2a0a01" stroke-width="2.5"/>
  <!-- big shoulder curve to neck -->
  <path d="M80 118 Q80 96 92 92 L92 118 Z" fill="url(#queBody)"/>
  <path d="M140 118 Q140 96 128 92 L128 118 Z" fill="url(#queBody)"/>
  <!-- gloss -->
  <rect x="74" y="120" width="7" height="120" rx="3.5" fill="#ffffff12"/>

  <!-- FACE up on the neck/shoulder area -->
  <g id="queCap">
    <path d="M82 40 Q110 20 140 40 L136 52 L84 52 Z" fill="#2a1a10"/>
    <path d="M82 40 Q74 44 72 52 Q80 48 86 48 Z" fill="#160a02"/>
  </g>
  <g id="queEyes">
    <circle cx="97" cy="70" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="123" cy="70" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="99" cy="71" r="3.5" fill="#111"/>
    <circle cx="125" cy="71" r="3.5" fill="#111"/>
  </g>
  <g id="queMouth">
    <path d="M94 90 Q110 104 126 90" stroke="#1f0500" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <rect x="107" y="91" width="7" height="7" rx="1.5" fill="#ffd700"/>
  </g>

  <!-- ===== LABEL: fits bottle + glass-edge occlusion ===== -->
  <g id="queLabelWrap">
    <rect x="62" y="158" width="96" height="72" rx="4" fill="#f7ead0"/>
    <rect x="68" y="165" width="84" height="16" fill="#6e1c04"/>
    <text x="110" y="177" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#ffe8d0">QUE'S</text>
    <text x="110" y="198" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#5a1803">BBQ SAUCE</text>
    <text x="110" y="213" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#7e4a24">smoky sweet · pass the vibe</text>
    <!-- glass-edge occlusion: dark strips over the label sides = label wraps under glass -->
    <rect x="62" y="150" width="12" height="88" rx="4" fill="#1f0500" opacity=".55"/>
    <rect x="146" y="150" width="12" height="88" rx="4" fill="#1f0500" opacity=".55"/>
    <rect x="72" y="150" width="4" height="88" fill="#1f0500" opacity=".18"/>
    <rect x="144" y="150" width="4" height="88" fill="#1f0500" opacity=".18"/>
    <!-- glass gloss across label -->
    <rect x="88" y="150" width="10" height="88" fill="#ffffff" opacity=".22"/>
  </g>

  <!-- figaro chain + flame -->
  <g id="queChain">
    <path d="M80 126 Q110 152 140 126" stroke="#ffd700" stroke-width="5" fill="none"/>
    <path d="M88 130 L94 140 M94 133 L100 138 M126 130 L132 140 M120 133 L126 138" stroke="#ffd700" stroke-width="2"/>
    <path d="M110 140 l-7 14 a7 7 0 0 0 14 0 Z" fill="#ff8a3d" stroke="#ffd700" stroke-width="1.5"/>
  </g>

  <g id="queArmL"><path d="M62 200 Q36 216 42 244" stroke="#5a1603" stroke-width="12" stroke-linecap="round" fill="none"/></g>
  <g id="queArmR"><path d="M158 200 Q184 216 178 244" stroke="#5a1603" stroke-width="12" stroke-linecap="round" fill="none"/></g>
  <rect x="78" y="262" width="30" height="12" rx="5" fill="#0a0a0a"/>
  <rect x="112" y="262" width="30" height="12" rx="5" fill="#0a0a0a"/>
</svg>
