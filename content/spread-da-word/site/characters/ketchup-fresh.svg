<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 330" width="200" height="330">
  <defs>
    <!-- classic ketchup bottle: red glass, tapered -->
    <linearGradient id="ketRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a1005"/>
      <stop offset="0.3" stop-color="#c4170a"/>
      <stop offset="0.6" stop-color="#e02415"/>
      <stop offset="1" stop-color="#6e0c03"/>
    </linearGradient>
    <radialGradient id="ketGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8543a" stop-opacity=".6"/>
      <stop offset="1" stop-color="#e02415" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== TRADITIONAL KETCHUP BOTTLE (fresh, full, upright) ===== -->
  <!-- red cap -->
  <rect x="84" y="20" width="32" height="26" rx="5" fill="#c0392b"/>
  <rect x="86" y="14" width="28" height="10" rx="3" fill="#a93226"/>
  <!-- narrow neck -->
  <rect x="88" y="46" width="24" height="34" fill="url(#ketRed)"/>
  <!-- shoulders + wide body taper -->
  <path d="M88 80 L112 80 L118 104 L118 250 Q118 290 100 290 Q82 290 82 250 L82 104 Z"
        fill="url(#ketRed)" stroke="#5a0a02" stroke-width="2"/>
  <!-- FULL ketchup (brighter, lively) -->
  <path d="M84 108 L116 108 L116 244 Q116 282 100 282 Q84 282 84 244 L84 108 Z" fill="#e02415" opacity=".75"/>
  <!-- freshness highlight -->
  <rect x="88" y="110" width="10" height="150" rx="5" fill="#ffffff55"/>
  <ellipse cx="92" cy="120" rx="4" ry="20" fill="#ffffff66"/>

  <!-- ===== LABEL (fresh/young, bold) ===== -->
  <g id="ketLabel">
    <rect x="70" y="130" width="60" height="88" rx="6" fill="#f5e6d0"/>
    <rect x="70" y="130" width="60" height="16" fill="#c0392b"/>
    <text x="100" y="142" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#fff" letter-spacing="1">TOMATO</text>
    <text x="100" y="170" text-anchor="middle" font-family="serif" font-size="20" font-weight="bold" fill="#8a1a08">Ketchup</text>
    <text x="100" y="185" text-anchor="middle" font-family="serif" font-size="8" font-style="italic" fill="#a04020">the star</text>
    <path d="M80 196 L120 196" stroke="#c0392b55" stroke-width="1"/>
    <text x="100" y="208" text-anchor="middle" font-family="monospace" font-size="6" fill="#8a4030">GOES WITH EVERYTHING</text>
  </g>

  <!-- ===== FACE (young, cocky) ===== -->
  <g id="ketEyes">
    <circle cx="90" cy="104" r="7" fill="#fff" stroke="#3a0a02" stroke-width="2.5"/>
    <circle cx="110" cy="104" r="7" fill="#fff" stroke="#3a0a02" stroke-width="2.5"/>
    <circle cx="92" cy="105" r="3.5" fill="#3a0a02"/>
    <circle cx="112" cy="105" r="3.5" fill="#3a0a02"/>
    <path d="M82 95 L90 91 L98 95" stroke="#3a0a02" stroke-width="2.4" fill="none"/>
    <path d="M102 95 L110 91 L118 95" stroke="#3a0a02" stroke-width="2.4" fill="none"/>
  </g>
  <g id="ketMouth">
    <path d="M90 120 Q100 129 110 118" stroke="#3a0a02" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== ARMS (young, energetic) ===== -->
  <g id="ketArmL"><path d="M84 150 Q56 164 52 196" stroke="#7a1003" stroke-width="9" stroke-linecap="round" fill="none"/></g>
  <g id="ketArmR"><path d="M116 150 Q144 164 148 196" stroke="#7a1003" stroke-width="9" stroke-linecap="round" fill="none"/></g>

  <!-- ===== shoes (fresh white sneakers) ===== -->
  <rect x="82" y="288" width="20" height="12" rx="5" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="98" y="288" width="20" height="12" rx="5" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="84" y="296" width="12" height="3" fill="#c0392b"/>
  <rect x="104" y="296" width="12" height="3" fill="#c0392b"/>
</svg>
