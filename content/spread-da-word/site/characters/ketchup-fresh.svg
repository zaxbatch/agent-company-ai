<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 380" width="220" height="380">
  <defs>
    <linearGradient id="kRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a00d05"/>
      <stop offset="0.35" stop-color="#d91a0c"/>
      <stop offset="0.6" stop-color="#ef2a18"/>
      <stop offset="1" stop-color="#850a03"/>
    </linearGradient>
  </defs>

  <!-- ===== TALL KETCHUP BOTTLE with LONG NARROW NECK (classic) ===== -->
  <!-- small cap on top -->
  <path d="M100 26 L120 26 L119 34 L101 34 Z" fill="#c0392b"/>
  <rect x="101" y="20" width="18" height="8" rx="3" fill="#a93226"/>
  <!-- LONG narrow neck -->
  <rect x="98" y="34" width="24" height="86" fill="url(#kRed)"/>
  <!-- tapered shoulders into wide body -->
  <path d="M96 120 L124 120 L132 150 L132 300 Q132 350 110 352 Q88 350 88 300 L88 150 Z"
        fill="url(#kRed)" stroke="#5a0a02" stroke-width="2.5"/>
  <!-- FULL ketchup content -->
  <path d="M90 156 L130 156 L130 292 Q130 340 110 344 Q90 340 90 292 L90 156 Z" fill="#ef2a18" opacity=".7"/>
  <!-- gloss along neck + body -->
  <rect x="100" y="40" width="6" height="60" rx="3" fill="#ffffff44"/>
  <rect x="92" y="120" width="9" height="180" rx="4" fill="#ffffff33"/>

  <!-- ===== KID LABEL (up on the body) ===== -->
  <g id="kLabel">
    <rect x="78" y="170" width="64" height="88" rx="8" fill="#f8e8d8"/>
    <rect x="78" y="170" width="64" height="15" fill="#c0392b"/>
    <text x="110" y="181" text-anchor="middle" font-family="monospace" font-size="7.5" font-weight="bold" fill="#fff">KETCHUP</text>
    <text x="110" y="210" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#a00d05">Jr.</text>
    <text x="110" y="225" text-anchor="middle" font-family="serif" font-size="8.5" font-style="italic" fill="#d05030">the optimist</text>
    <path d="M88 236 L132 236" stroke="#c0392b33" stroke-width="1"/>
    <text x="110" y="248" text-anchor="middle" font-family="monospace" font-size="5.5" fill="#c06040">GOES WITH EVERYTHING</text>
  </g>

  <!-- ===== KID FACE (on the tall body, below label is too low; put on upper body/label top area) ===== -->
  <!-- Face on the body above label -->
  <g id="kEyes">
    <circle cx="98" cy="150" r="8" fill="#fff" stroke="#3a0a02" stroke-width="2.5"/>
    <circle cx="122" cy="150" r="8" fill="#fff" stroke="#3a0a02" stroke-width="2.5"/>
    <circle cx="100" cy="151" r="4" fill="#3a0a02"/>
    <circle cx="124" cy="151" r="4" fill="#3a0a02"/>
    <path d="M88 140 Q98 133 108 140" stroke="#3a0a02" stroke-width="2.4" fill="none"/>
    <path d="M112 140 Q122 133 132 140" stroke="#3a0a02" stroke-width="2.4" fill="none"/>
    <circle cx="90" cy="166" r="5" fill="#ff8a70" opacity=".5"/>
    <circle cx="130" cy="166" r="5" fill="#ff8a70" opacity=".5"/>
  </g>
  <g id="kMouth">
    <path d="M98 174 Q110 190 122 174 Z" fill="#5a0a02"/>
    <path d="M100 175 Q110 187 120 175" stroke="#fff" stroke-width="1.5" fill="none"/>
  </g>

  <!-- ===== ARMS ===== -->
  <g id="kArmL"><path d="M90 200 Q58 218 52 258" stroke="#a00d05" stroke-width="10" stroke-linecap="round" fill="none"/></g>
  <g id="kArmR"><path d="M130 200 Q162 218 168 258" stroke="#a00d05" stroke-width="10" stroke-linecap="round" fill="none"/></g>

  <!-- ===== shoes ===== -->
  <rect x="92" y="348" width="22" height="11" rx="5" fill="#fff" stroke="#d0d0d0" stroke-width="1.5"/>
  <rect x="106" y="348" width="22" height="11" rx="5" fill="#fff" stroke="#d0d0d0" stroke-width="1.5"/>
</svg>
