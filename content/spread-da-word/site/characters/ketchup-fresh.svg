<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 320" width="220" height="320">
  <defs>
    <linearGradient id="kRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a00d05"/>
      <stop offset="0.35" stop-color="#d91a0c"/>
      <stop offset="0.6" stop-color="#ef2a18"/>
      <stop offset="1" stop-color="#850a03"/>
    </linearGradient>
  </defs>

  <!-- ===== CLASSIC KETCHUP BOTTLE (squat-ish, wide body, short neck) ===== -->
  <!-- flip-top cap -->
  <path d="M96 18 L124 18 L122 28 L98 28 Z" fill="#c0392b"/>
  <rect x="98" y="12" width="24" height="8" rx="3" fill="#a93226"/>
  <!-- short neck -->
  <rect x="94" y="28" width="32" height="22" fill="url(#kRed)"/>
  <!-- wide shoulders -->
  <path d="M88 50 L132 50 L138 70 L138 230 Q138 270 110 272 Q82 270 82 230 L82 70 Z"
        fill="url(#kRed)" stroke="#5a0a02" stroke-width="2.5"/>
  <!-- FULL content (bright, youthful) -->
  <path d="M84 76 L136 76 L136 224 Q136 264 110 266 Q84 264 84 224 L84 76 Z" fill="#ef2a18" opacity=".7"/>
  <!-- gloss -->
  <rect x="88" y="52" width="10" height="190" rx="5" fill="#ffffff44"/>

  <!-- ===== KID LABEL (bright, fun) ===== -->
  <g id="kLabel">
    <rect x="76" y="96" width="68" height="96" rx="8" fill="#f8e8d8"/>
    <rect x="76" y="96" width="68" height="16" fill="#c0392b"/>
    <text x="110" y="108" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#fff">KETCHUP</text>
    <text x="110" y="140" text-anchor="middle" font-family="serif" font-size="17" font-weight="bold" fill="#a00d05">Jr.</text>
    <text x="110" y="155" text-anchor="middle" font-family="serif" font-size="9" font-style="italic" fill="#d05030">the optimist</text>
    <path d="M86 164 L134 164" stroke="#c0392b33" stroke-width="1"/>
    <text x="110" y="180" text-anchor="middle" font-family="monospace" font-size="6" fill="#c06040">GOES WITH EVERYTHING</text>
  </g>

  <!-- ===== KID FACE (bright eyes, big smile, optimistic) ===== -->
  <g id="kEyes">
    <circle cx="96" cy="76" r="7.5" fill="#fff" stroke="#3a0a02" stroke-width="2.5"/>
    <circle cx="124" cy="76" r="7.5" fill="#fff" stroke="#3a0a02" stroke-width="2.5"/>
    <circle cx="98" cy="77" r="4" fill="#3a0a02"/>
    <circle cx="126" cy="77" r="4" fill="#3a0a02"/>
    <!-- big kid eyebrows, open -->
    <path d="M86 66 Q96 60 106 66" stroke="#3a0a02" stroke-width="2.4" fill="none"/>
    <path d="M114 66 Q124 60 134 66" stroke="#3a0a02" stroke-width="2.4" fill="none"/>
    <!-- rosy cheeks -->
    <circle cx="88" cy="92" r="5" fill="#ff8a70" opacity=".5"/>
    <circle cx="132" cy="92" r="5" fill="#ff8a70" opacity=".5"/>
  </g>
  <g id="kMouth">
    <!-- big happy open-mouth smile -->
    <path d="M96 100 Q110 116 124 100 Z" fill="#5a0a02"/>
    <path d="M98 101 Q110 113 122 101" stroke="#fff" stroke-width="1.5" fill="none"/>
  </g>

  <!-- ===== ARMS (excited kid) ===== -->
  <g id="kArmL"><path d="M84 120 Q52 138 48 176" stroke="#a00d05" stroke-width="10" stroke-linecap="round" fill="none"/></g>
  <g id="kArmR"><path d="M136 120 Q168 138 172 176" stroke="#a00d05" stroke-width="10" stroke-linecap="round" fill="none"/></g>

  <!-- ===== shoes (bright red sneakers) ===== -->
  <rect x="90" y="268" width="24" height="12" rx="5" fill="#fff" stroke="#d0d0d0" stroke-width="1.5"/>
  <rect x="106" y="268" width="24" height="12" rx="5" fill="#fff" stroke="#d0d0d0" stroke-width="1.5"/>
  <rect x="92" y="276" width="16" height="3" fill="#c0392b"/>
  <rect x="114" y="276" width="16" height="3" fill="#c0392b"/>
</svg>
