<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 330" width="220" height="330">
  <defs>
    <linearGradient id="kRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a00d05"/>
      <stop offset="0.35" stop-color="#d91a0c"/>
      <stop offset="0.6" stop-color="#ef2a18"/>
      <stop offset="1" stop-color="#850a03"/>
    </linearGradient>
    <linearGradient id="kGlassLite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d03020"/>
      <stop offset="0.5" stop-color="#e84838"/>
      <stop offset="1" stop-color="#b02818"/>
    </linearGradient>
  </defs>

  <!-- ===== CLASSIC HEINZ-57 STYLE BOTTLE: white cap, short neck, wide glass body ===== -->
  <!-- WHITE CAP -->
  <rect x="92" y="18" width="36" height="26" rx="6" fill="#f4f4f0" stroke="#c8c8c4" stroke-width="1.5"/>
  <path d="M94 30 L126 30 L126 36 L94 36 Z" fill="#d8d8d4"/>
  <!-- short neck -->
  <rect x="96" y="44" width="28" height="26" fill="url(#kRed)"/>
  <!-- wide glass body (heinz 57 proportions - body nearly as wide as tall, rounded shoulders) -->
  <path d="M86 70 L134 70 L142 100 L142 230 Q142 282 110 284 Q78 282 78 230 L78 100 Z"
        fill="url(#kRed)" stroke="#5a0a02" stroke-width="2.5"/>
  <!-- FULL content -->
  <path d="M80 106 L140 106 L140 224 Q140 276 110 278 Q80 276 80 224 L80 106 Z" fill="#e02415" opacity=".75"/>
  <!-- gloss -->
  <rect x="84" y="74" width="10" height="180" rx="5" fill="#ffffff55"/>
  <rect x="126" y="80" width="5" height="160" rx="2" fill="#ffffff33"/>

  <!-- ===== KID LABEL (classic oval-ish label) ===== -->
  <g id="kLabel">
    <rect x="78" y="118" width="64" height="90" rx="10" fill="#f8e8d8"/>
    <rect x="78" y="118" width="64" height="16" fill="#c0392b"/>
    <text x="110" y="130" text-anchor="middle" font-family="monospace" font-size="7.5" font-weight="bold" fill="#fff">KETCHUP</text>
    <text x="110" y="158" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#a00d05">Jr.</text>
    <text x="110" y="173" text-anchor="middle" font-family="serif" font-size="8.5" font-style="italic" fill="#d05030">the optimist</text>
    <path d="M88 184 L132 184" stroke="#c0392b33" stroke-width="1"/>
    <text x="110" y="198" text-anchor="middle" font-family="monospace" font-size="5.5" fill="#c06040">GOES WITH EVERYTHING</text>
  </g>

  <!-- ===== KID FACE ===== -->
  <g id="kEyes">
    <circle cx="99" cy="96" r="7" fill="#fff" stroke="#3a0a02" stroke-width="2.5"/>
    <circle cx="121" cy="96" r="7" fill="#fff" stroke="#3a0a02" stroke-width="2.5"/>
    <circle cx="101" cy="97" r="3.5" fill="#3a0a02"/>
    <circle cx="123" cy="97" r="3.5" fill="#3a0a02"/>
    <path d="M90 87 Q99 80 108 87" stroke="#3a0a02" stroke-width="2.2" fill="none"/>
    <path d="M112 87 Q121 80 130 87" stroke="#3a0a02" stroke-width="2.2" fill="none"/>
    <circle cx="92" cy="110" r="4.5" fill="#ff8a70" opacity=".5"/>
    <circle cx="128" cy="110" r="4.5" fill="#ff8a70" opacity=".5"/>
  </g>
  <g id="kMouth">
    <path d="M99 116 Q110 130 121 116 Z" fill="#5a0a02"/>
    <path d="M101 117 Q110 127 119 117" stroke="#fff" stroke-width="1.4" fill="none"/>
  </g>

  <!-- ===== ARMS ===== -->
  <g id="kArmL"><path d="M80 130 Q50 148 46 190" stroke="#a00d05" stroke-width="10" stroke-linecap="round" fill="none"/></g>
  <g id="kArmR"><path d="M140 130 Q170 148 174 190" stroke="#a00d05" stroke-width="10" stroke-linecap="round" fill="none"/></g>

  <!-- ===== shoes ===== -->
  <rect x="92" y="280" width="20" height="11" rx="5" fill="#fff" stroke="#d0d0d0" stroke-width="1.5"/>
  <rect x="108" y="280" width="20" height="11" rx="5" fill="#fff" stroke="#d0d0d0" stroke-width="1.5"/>
</svg>
