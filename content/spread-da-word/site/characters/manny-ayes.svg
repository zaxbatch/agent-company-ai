<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 300" width="220" height="300">
  <defs>
    <linearGradient id="mayoGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8c8d0"/>
      <stop offset="0.3" stop-color="#eef4f6"/>
      <stop offset="0.6" stop-color="#dfe8ec"/>
      <stop offset="1" stop-color="#9cb0b8"/>
    </linearGradient>
    <linearGradient id="mayoBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a3a5c"/>
      <stop offset="0.5" stop-color="#2a5a8c"/>
      <stop offset="1" stop-color="#16324e"/>
    </linearGradient>
  </defs>

  <!-- ===== WIDE SQUAT GLASS MAYO JAR (not a bottle) ===== -->
  <!-- silver screw lid (wide) -->
  <path d="M74 34 L146 34 L146 52 L74 52 Z" fill="#d8dde0" stroke="#8a9298" stroke-width="2"/>
  <path d="M76 28 L144 28 L144 36 L76 36 Z" fill="#aeb6bc"/>
  <!-- wide jar: short neck, wide body with rounded bottom -->
  <path d="M80 52 L140 52 L144 74 L144 230 Q144 258 110 260 Q76 258 76 230 L76 74 Z"
        fill="url(#mayoGlass)" stroke="#7a8a92" stroke-width="2.5"/>
  <!-- creamy mayo content -->
  <path d="M80 86 L140 86 L140 222 Q140 250 110 252 Q80 250 80 222 L80 86 Z" fill="#fdf6ea" opacity=".85"/>
  <!-- gloss -->
  <rect x="86" y="58" width="9" height="170" rx="4.5" fill="#ffffff77"/>

  <!-- ===== LABEL (contained INSIDE jar width 76-144) ===== -->
  <g id="mayoLabel">
    <rect x="84" y="104" width="52" height="96" rx="4" fill="#f4f8fb"/>
    <rect x="84" y="104" width="52" height="16" fill="url(#mayoBlue)"/>
    <text x="110" y="115" text-anchor="middle" font-family="monospace" font-size="7.5" font-weight="bold" fill="#fff" letter-spacing="1">MAYONNAISE</text>
    <text x="110" y="140" text-anchor="middle" font-family="serif" font-size="15" font-weight="bold" fill="#1a3a5c">Manny</text>
    <text x="110" y="154" text-anchor="middle" font-family="serif" font-size="8" font-style="italic" fill="#4a6a8a">"Da Man" Ayes</text>
    <text x="110" y="178" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#5a7a9a">PREMIUM · SMOOTH</text>
    <path d="M88 186 L132 186" stroke="#1a3a5c22" stroke-width="1"/>
    <text x="110" y="196" text-anchor="middle" font-family="monospace" font-size="5.5" fill="#8aa0b0">est. the fridge</text>
  </g>

  <!-- ===== FACE ===== -->
  <g id="mayoEyes">
    <circle cx="99" cy="68" r="5.5" fill="#fff" stroke="#1a2a3a" stroke-width="1.8"/>
    <circle cx="121" cy="68" r="5.5" fill="#fff" stroke="#1a2a3a" stroke-width="1.8"/>
    <circle cx="101" cy="69" r="2.8" fill="#1a2a3a"/>
    <circle cx="123" cy="69" r="2.8" fill="#1a2a3a"/>
    <path d="M93 60 L99 57 L105 60" stroke="#1a2a3a" stroke-width="1.8" fill="none"/>
    <path d="M115 60 L121 57 L127 60" stroke="#1a2a3a" stroke-width="1.8" fill="none"/>
  </g>
  <g id="mayoMouth"><path d="M100 84 Q110 89 120 82" stroke="#1a2a3a" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>

  <!-- ===== ARMS (suit sleeves, hang from wide body) ===== -->
  <g id="mayoArmL"><path d="M80 110 Q58 126 54 156" stroke="#2a3a52" stroke-width="9" stroke-linecap="round" fill="none"/></g>
  <g id="mayoArmR"><path d="M140 110 Q162 126 166 156" stroke="#2a3a52" stroke-width="9" stroke-linecap="round" fill="none"/></g>
  <g id="mayoWatch"><circle cx="166" cy="150" r="6" fill="#c8d0d8" stroke="#8a9298" stroke-width="1.8"/><circle cx="166" cy="150" r="2.5" fill="#1a3a5c"/></g>

  <!-- ===== shoes ===== -->
  <rect x="86" y="256" width="22" height="10" rx="4" fill="#1a1a1a"/>
  <rect x="112" y="256" width="22" height="10" rx="4" fill="#1a1a1a"/>
</svg>
