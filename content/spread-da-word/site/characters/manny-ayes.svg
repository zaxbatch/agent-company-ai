<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240">
  <defs>
    <linearGradient id="mayoGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8c8d0"/>
      <stop offset="0.3" stop-color="#eef4f6"/>
      <stop offset="0.6" stop-color="#dfe8ec"/>
      <stop offset="1" stop-color="#9cb0b8"/>
    </linearGradient>
    <linearGradient id="mayoBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a3a5c"/>
      <stop offset="0.5" stop-color="#2a5a8c"/>
      <stop offset="1" stop-color="#16324e"/>
    </linearGradient>
  </defs>

  <!-- ===== WIDE SQUAT MAYO JAR ===== -->
  <!-- silver lid -->
  <path d="M96 30 L204 30 L204 46 L96 46 Z" fill="#d8dde0" stroke="#8a9298" stroke-width="2"/>
  <path d="M100 24 L200 24 L200 31 L100 31 Z" fill="#aeb6bc"/>
  <!-- jar body (very wide) -->
  <path d="M100 46 L200 46 L206 66 L206 196 Q206 224 150 226 Q94 224 94 196 L94 66 Z"
        fill="url(#mayoGlass)" stroke="#7a8a92" stroke-width="2.5"/>
  <!-- mayo content -->
  <path d="M98 78 L202 78 L202 188 Q202 216 150 218 Q98 216 98 188 L98 78 Z" fill="#fdf6ea" opacity=".9"/>
  <!-- gloss -->
  <rect x="104" y="52" width="10" height="150" rx="5" fill="#ffffff99"/>

  <!-- ===== FACE (upper on jar) ===== -->
  <g id="mayoEyes">
    <circle cx="136" cy="62" r="6" fill="#fff" stroke="#1a2a3a" stroke-width="2"/>
    <circle cx="164" cy="62" r="6" fill="#fff" stroke="#1a2a3a" stroke-width="2"/>
    <circle cx="138" cy="63" r="3" fill="#1a2a3a"/>
    <circle cx="166" cy="63" r="3" fill="#1a2a3a"/>
    <path d="M128 53 L136 49 L144 53" stroke="#1a2a3a" stroke-width="2" fill="none"/>
    <path d="M156 53 L164 49 L172 53" stroke="#1a2a3a" stroke-width="2" fill="none"/>
  </g>
  <g id="mayoMouth"><path d="M136 78 Q150 84 164 76" stroke="#1a2a3a" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>

  <!-- ===== LABEL with TRIM (gold lines top/bottom break up white) ===== -->
  <g id="mayoLabel">
    <!-- white label panel -->
    <rect x="112" y="92" width="76" height="88" rx="5" fill="#f4f8fb"/>
    <!-- top blue band -->
    <rect x="112" y="92" width="76" height="14" fill="url(#mayoBlue)"/>
    <!-- gold trim lines -->
    <rect x="112" y="106" width="76" height="2.5" fill="#d4af37"/>
    <rect x="112" y="172" width="76" height="2.5" fill="#d4af37"/>
    <!-- text -->
    
    <text x="150" y="126" text-anchor="middle" font-family="serif" font-size="20" font-weight="bold" fill="#1a3a5c">Manny</text>
    <text x="150" y="141" text-anchor="middle" font-family="serif" font-size="9" font-style="italic" fill="#3a5a7a">"Da Man's"</text>
    <!-- gold divider -->
    <path d="M124 152 L176 152" stroke="#d4af37" stroke-width="1.4"/>
    <text x="150" y="166" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#5a7a9a">MAYONNAISE</text>
  </g>

  <!-- ===== ARMS (suit sleeves from wide body sides) ===== -->
  <g id="mayoArmL"><path d="M98 100 Q70 118 66 148" stroke="#2a3a52" stroke-width="10" stroke-linecap="round" fill="none"/></g>
  <g id="mayoArmR"><path d="M202 100 Q230 118 234 148" stroke="#2a3a52" stroke-width="10" stroke-linecap="round" fill="none"/></g>
  <g id="mayoWatch"><circle cx="234" cy="142" r="7" fill="#c8d0d8" stroke="#8a9298" stroke-width="2"/><circle cx="234" cy="142" r="3" fill="#1a3a5c"/></g>

  <!-- ===== shoes ===== -->
  <rect x="118" y="222" width="26" height="11" rx="4" fill="#1a1a1a"/>
  <rect x="156" y="222" width="26" height="11" rx="4" fill="#1a1a1a"/>
</svg>
