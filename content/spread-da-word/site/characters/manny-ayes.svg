<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 330" width="220" height="310">
  <defs>
    <!-- sleek glass mayo jar, cool white -->
    <linearGradient id="mayoGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8d8e0"/>
      <stop offset="0.35" stop-color="#f0f6f8"/>
      <stop offset="0.6" stop-color="#e6eef2"/>
      <stop offset="1" stop-color="#b0c4cc"/>
    </linearGradient>
    <linearGradient id="mayoBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a3a5c"/>
      <stop offset="0.5" stop-color="#2a5a8c"/>
      <stop offset="1" stop-color="#16324e"/>
    </linearGradient>
  </defs>

  <!-- ===== Fridge jar body (wide glass jar, flat bottom, cool tones) ===== -->
  <!-- silver lid (crisp, premium) -->
  <path d="M84 46 L136 46 L136 62 L84 62 Z" fill="#d8dde0" stroke="#8a9298" stroke-width="2"/>
  <path d="M86 40 L134 40 L134 48 L86 48 Z" fill="#aeb6bc"/>
  <!-- jar: rounded shoulders into a clean body -->
  <path d="M88 62 L132 62 L140 74 L140 254 Q140 262 110 262 Q80 262 80 254 L80 74 Z"
        fill="url(#mayoGlass)" stroke="#7a8a92" stroke-width="2.5"/>
  <!-- mayo content (creamy) -->
  <path d="M84 100 L136 100 L138 240 Q138 258 110 258 Q82 258 82 240 L84 100 Z" fill="#fdf6ea" opacity=".85"/>
  <!-- gloss -->
  <rect x="88" y="70" width="10" height="170" rx="5" fill="#ffffff66"/>

  <!-- ===== LABEL: upper-class country club ===== -->
  <g id="mayoLabel">
    <rect x="74" y="120" width="72" height="100" rx="6" fill="#f4f8fb" stroke="#1a3a5c" stroke-width="3"/>
    <rect x="74" y="120" width="72" height="22" fill="url(#mayoBlue)"/>
    <text x="110" y="135" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#fff" letter-spacing="2">MAYO</text>
    <text x="110" y="160" text-anchor="middle" font-family="serif" font-size="13" font-weight="bold" fill="#1a3a5c">Manny</text>
    <text x="110" y="175" text-anchor="middle" font-family="serif" font-size="9" font-style="italic" fill="#4a6a8a">"Da Man" Ayes</text>
    <text x="110" y="195" text-anchor="middle" font-family="monospace" font-size="8" fill="#5a7a9a">THE FRIDGE</text>
    <text x="110" y="207" text-anchor="middle" font-family="monospace" font-size="7" fill="#8aa0b0">premium · smooth</text>
  </g>

  <!-- ===== FACE ===== -->
  <!-- smug smile (diplomat but condescending) -->
  <g id="mayoEyes">
    <circle cx="98" cy="88" r="6" fill="#fff" stroke="#1a2a3a" stroke-width="2"/>
    <circle cx="122" cy="88" r="6" fill="#fff" stroke="#1a2a3a" stroke-width="2"/>
    <circle cx="100" cy="89" r="3" fill="#1a2a3a"/>
    <circle cx="124" cy="89" r="3" fill="#1a2a3a"/>
    <!-- smug brows -->
    <path d="M92 78 Q98 74 104 78" stroke="#1a2a3a" stroke-width="2" fill="none"/>
    <path d="M116 78 Q122 74 128 78" stroke="#1a2a3a" stroke-width="2" fill="none"/>
  </g>
  <g id="mayoMouth">
    <path d="M98 106 Q110 112 122 104" stroke="#1a2a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== ARMS (suit jacket sleeves - upper class) ===== -->
  <g id="mayoArmL"><path d="M82 150 Q56 168 52 196" stroke="#2a3a52" stroke-width="10" stroke-linecap="round" fill="none"/></g>
  <g id="mayoArmR"><path d="M138 150 Q164 168 168 196" stroke="#2a3a52" stroke-width="10" stroke-linecap="round" fill="none"/></g>

  <!-- ===== silver wristwatch (wealth signal) ===== -->
  <g id="mayoWatch"><circle cx="168" cy="188" r="7" fill="#c8d0d8" stroke="#8a9298" stroke-width="2"/><circle cx="168" cy="188" r="3" fill="#1a3a5c"/></g>

  <!-- ===== shoes (polished) ===== -->
  <rect x="86" y="260" width="24" height="12" rx="4" fill="#1a1a1a"/>
  <rect x="110" y="260" width="24" height="12" rx="4" fill="#1a1a1a"/>
  <rect x="88" y="262" width="8" height="4" fill="#555"/>
</svg>
