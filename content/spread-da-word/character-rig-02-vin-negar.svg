<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <title>Spread Da Word — Vin Negar (bottle of vinegar, from the hood)</title>
  <desc>Cutout rig: vinegar bottle body with articulated arms, eyes, and a cap. Flat South Park-style shapes, Rive-ready.</desc>

  <!-- ===== LEGS (sneakers, "from the hood") ===== -->
  <g id="leg-left" style="transform-origin:170px 400px;">
    <rect x="158" y="400" width="24" height="34" fill="#222" rx="5"/>
    <rect x="150" y="430" width="40" height="16" fill="#fff" rx="6"/>
    <rect x="150" y="442" width="40" height="5" fill="#888" rx="2"/>
  </g>
  <g id="leg-right" style="transform-origin:222px 400px;">
    <rect x="210" y="400" width="24" height="34" fill="#222" rx="5"/>
    <rect x="202" y="430" width="40" height="16" fill="#fff" rx="6"/>
    <rect x="202" y="442" width="40" height="5" fill="#888" rx="2"/>
  </g>

  <!-- ===== BOTTLE BODY (torso, the vinegar bottle) ===== -->
  <g id="body" style="transform-origin:196px 340px;">
    <!-- bottle body -->
    <path d="M156 260 L236 260 L246 300 L248 380 Q248 400 196 400 Q144 400 144 380 L146 300 Z" fill="#d9a066"/>
    <!-- label -->
    <rect x="156" y="300" width="80" height="60" rx="6" fill="#f5e6d0"/>
    <rect x="166" y="308" width="60" height="14" rx="3" fill="#7a4a1e"/>
    <text x="196" y="320" font-family="monospace" font-size="10" fill="#fff" text-anchor="middle">VIN NEGAR</text>
    <text x="196" y="344" font-family="monospace" font-size="9" fill="#7a4a1e" text-anchor="middle">est. the hood</text>
    <!-- cap (neck) -->
    <rect x="176" y="236" width="40" height="28" rx="6" fill="#2b3a55"/>
    <rect x="182" y="230" width="28" height="8" rx="3" fill="#1f2a40"/>
  </g>

  <!-- ===== ARMS ===== -->
  <g id="arm-left" style="transform-origin:150px 272px;">
    <rect x="124" y="272" width="26" height="66" rx="10" fill="#d9a066"/>
    <circle cx="137" cy="342" r="11" fill="#d9a066"/>
  </g>
  <g id="arm-right" style="transform-origin:242px 272px;">
    <rect x="242" y="272" width="26" height="66" rx="10" fill="#d9a066"/>
    <circle cx="255" cy="342" r="11" fill="#d9a066"/>
  </g>

  <!-- ===== EYES (on the bottle, above the label) ===== -->
  <g id="eyes" style="transform-origin:196px 272px;">
    <circle cx="178" cy="268" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="214" cy="268" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="180" cy="269" r="4" fill="#111"/>
    <circle cx="216" cy="269" r="4" fill="#111"/>
    <!-- brows (stern, hood energy) -->
    <rect x="168" y="254" width="20" height="4" rx="2" fill="#111" transform="rotate(-8 178 256)"/>
    <rect x="204" y="254" width="20" height="4" rx="2" fill="#111" transform="rotate(8 214 256)"/>
  </g>

  <!-- ===== MOUTH (smirk) ===== -->
  <g id="mouth" style="transform-origin:196px 292px;">
    <path d="M182 288 Q196 298 210 288" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- RIG NOTES -->
  <text x="20" y="470" font-family="monospace" font-size="11" fill="#666">RIG: body / eyes / mouth / arm-left / arm-right / leg-left / leg-right</text>
  <text x="20" y="486" font-family="monospace" font-size="11" fill="#666">Vin Negar — vinegar bottle, from the hood. Import to Rive for cutout animation.</text>
</svg>
