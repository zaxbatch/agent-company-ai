<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <title>Spread Da Word — Character Rig 01 (South Park-style cutout)</title>
  <desc>Flat cutout character with articulated groups: head, torso, arms, legs. Each group has a transform-origin so it can be rigged/posed in Rive.</desc>

  <!-- Character: "Snow" — a chill snow snake kid, South Park flat style -->

  <!-- ===== LEGS (origin at hips) ===== -->
  <g id="leg-left" transform="translate(0,0)" style="transform-origin:170px 330px;">
    <rect x="158" y="330" width="26" height="52" fill="#2b3a55" rx="6"/>
    <rect x="152" y="380" width="38" height="14" fill="#1f2a40" rx="6"/>
  </g>
  <g id="leg-right" transform="translate(0,0)" style="transform-origin:214px 330px;">
    <rect x="202" y="330" width="26" height="52" fill="#2b3a55" rx="6"/>
    <rect x="196" y="380" width="38" height="14" fill="#1f2a40" rx="6"/>
  </g>

  <!-- ===== TORSO ===== -->
  <g id="torso" style="transform-origin:192px 330px;">
    <rect x="152" y="246" width="80" height="88" rx="14" fill="#e8f1fb"/>
    <rect x="168" y="262" width="48" height="26" rx="6" fill="#3a86ff"/>
    <!-- snowflake logo on shirt -->
    <g transform="translate(192,276)">
      <line x1="0" y1="-9" x2="0" y2="9" stroke="#fff" stroke-width="2"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#fff" stroke-width="2"/>
      <line x1="-6" y1="-6" x2="6" y2="6" stroke="#fff" stroke-width="2"/>
      <line x1="6" y1="-6" x2="-6" y2="6" stroke="#fff" stroke-width="2"/>
    </g>
  </g>

  <!-- ===== LEFT ARM (origin at shoulder) ===== -->
  <g id="arm-left" style="transform-origin:158px 258px;">
    <rect x="132" y="258" width="26" height="64" rx="10" fill="#e8f1fb"/>
    <circle cx="145" cy="326" r="11" fill="#e8f1fb"/>
  </g>

  <!-- ===== RIGHT ARM (origin at shoulder) ===== -->
  <g id="arm-right" style="transform-origin:226px 258px;">
    <rect x="226" y="258" width="26" height="64" rx="10" fill="#e8f1fb"/>
    <circle cx="239" cy="326" r="11" fill="#e8f1fb"/>
  </g>

  <!-- ===== HEAD (origin at neck) ===== -->
  <g id="head" style="transform-origin:192px 246px;">
    <!-- South Park style: simple oval face -->
    <ellipse cx="192" cy="196" rx="54" ry="62" fill="#ffd9a0"/>
    <!-- eyes (flat, simple) -->
    <circle cx="172" cy="188" r="6" fill="#111"/>
    <circle cx="212" cy="188" r="6" fill="#111"/>
    <!-- mouth -->
    <path d="M182 218 Q192 228 202 218" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- beanie hat -->
    <path d="M138 180 Q192 108 246 180 L238 170 Q192 116 146 170 Z" fill="#3a86ff"/>
    <rect x="138" y="176" width="108" height="14" rx="7" fill="#2f6fd8"/>
    <!-- hat pom -->
    <circle cx="192" cy="112" r="9" fill="#ff5d8f"/>
  </g>

  <!-- RIG NOTES (for Rive import) -->
  <text x="20" y="470" font-family="monospace" font-size="11" fill="#666">RIG: head / torso / arm-left / arm-right / leg-left / leg-right</text>
  <text x="20" y="486" font-family="monospace" font-size="11" fill="#666">Origins set at joints — import into Rive to animate cutout style</text>
</svg>
