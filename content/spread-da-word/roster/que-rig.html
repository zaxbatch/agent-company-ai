<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Que — BBQ Sauce Cutout Rig (Vin's best friend)</title>
<style>
  body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:monospace;color:#eee;margin:0}
  h1{font-size:20px;letter-spacing:2px;color:#ff9f43;margin-bottom:4px}
  .sub{color:#aaa;font-size:12px;margin-bottom:16px}
  svg{background:#0f0f1e;border-radius:10px;border:2px solid #333;box-shadow:0 0 30px rgba(255,159,67,.15)}
  .note{margin-top:12px;color:#777;font-size:11px;text-align:center;max-width:460px;line-height:1.5}
</style>
</head>
<body>
<h1>🍖 QUE</h1>
<div class="sub">BBQ sauce · the heart of the hood · Vin's best friend · party energy</div>
<!-- QUE: squat BBQ sauce bottle, warm smoky colors, party vibe. South Park cutout. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="360" height="468">
  <!-- LEGS -->
  <g id="leg-left" style="transform-origin:168px 430px;">
    <rect x="156" y="430" width="24" height="30" fill="#2b1a0e" rx="5"/>
    <rect x="148" y="458" width="40" height="14" fill="#5c3317" rx="6"/>
  </g>
  <g id="leg-right" style="transform-origin:222px 430px;">
    <rect x="210" y="430" width="24" height="30" fill="#2b1a0e" rx="5"/>
    <rect x="204" y="458" width="40" height="14" fill="#5c3317" rx="6"/>
  </g>

  <!-- BOTTLE BODY (squat BBQ bottle) -->
  <g id="bottle" style="transform-origin:195px 380px;">
    <path d="M148 250 L242 250 L252 300 L256 400 Q256 430 195 430 Q134 430 134 400 L138 300 Z" fill="#6b2d14"/>
    <path d="M158 258 L170 258 L164 410 L152 410 Z" fill="#8a3d1c" opacity=".7"/>
    <!-- cap -->
    <rect x="174" y="218" width="42" height="32" rx="6" fill="#2b1a0e"/>
    <rect x="180" y="210" width="30" height="10" rx="3" fill="#1a0f06"/>
    <!-- label = party shirt -->
    <rect x="150" y="310" width="90" height="70" rx="6" fill="#f5e6d0"/>
    <rect x="160" y="318" width="70" height="16" rx="3" fill="#c25e2b"/>
    <text x="195" y="331" font-family="monospace" font-size="10" fill="#fff" text-anchor="middle">QUE</text>
    <text x="195" y="352" font-family="monospace" font-size="8" fill="#8a3d1c" text-anchor="middle">pass the sauce</text>
    <text x="195" y="366" font-family="monospace" font-size="8" fill="#8a3d1c" text-anchor="middle">pass the vibe 🎉</text>
  </g>

  <!-- EYES (friendly, warm) -->
  <g id="eyes" style="transform-origin:195px 288px;">
    <circle cx="178" cy="286" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="212" cy="286" r="9" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="180" cy="287" r="4" fill="#111"/>
    <circle cx="214" cy="287" r="4" fill="#111"/>
    <!-- warm brows (raised) -->
    <path d="M168 276 Q178 270 188 276" stroke="#111" stroke-width="2.5" fill="none"/>
    <path d="M202 276 Q212 270 222 276" stroke="#111" stroke-width="2.5" fill="none"/>
  </g>

  <!-- MOUTH (big friendly grin) -->
  <g id="mouth" style="transform-origin:195px 312px;">
    <path d="M178 306 Q195 322 212 306" stroke="#111" stroke-width="3" fill="#ffd9a0" stroke-linecap="round"/>
  </g>

  <!-- ARMS (open, welcoming) -->
  <g id="arm-left" style="transform-origin:140px 284px;">
    <rect x="112" y="284" width="28" height="64" rx="10" fill="#6b2d14"/>
    <circle cx="126" cy="352" r="11" fill="#6b2d14"/>
  </g>
  <g id="arm-right" style="transform-origin:250px 284px;">
    <rect x="250" y="284" width="28" height="64" rx="10" fill="#6b2d14"/>
    <circle cx="264" cy="352" r="11" fill="#6b2d14"/>
  </g>

  <text x="20" y="498" font-family="monospace" font-size="10" fill="#888">QUE — warm BBQ bottle · party heart · Vin's best friend · cutout rig for Rive</text>
</svg>
<div class="note">"Pass the sauce, pass the vibe." Que is the warmth to Vin's edge — big smile, open arms, always the life of the cookout.</div>
</body>
</html>
