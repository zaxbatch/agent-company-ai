<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aji — Hot Sauce Cutout Rig (The Sparkplug)</title>
<style>
  body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:monospace;color:#eee;margin:0}
  h1{font-size:20px;letter-spacing:2px;color:#ff4757;margin-bottom:4px}
  .sub{color:#aaa;font-size:12px;margin-bottom:16px}
  svg{background:#0f0f1e;border-radius:10px;border:2px solid #333;box-shadow:0 0 30px rgba(255,71,87,.2)}
  .note{margin-top:12px;color:#777;font-size:11px;text-align:center;max-width:460px;line-height:1.5}
</style>
</head>
<body>
<h1>🌶️ AJI</h1>
<div class="sub">hot sauce · THE SPARKPLUG · brings heat &amp; drama · chaotic good</div>
<!-- AJI: slim hot sauce bottle, RED hot colors, flame vibes, always extra. South Park cutout. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="360" height="468">
  <!-- LEGS (sneakers, always mid-step) -->
  <g id="leg-left" style="transform-origin:172px 440px;">
    <rect x="158" y="440" width="26" height="30" fill="#3a0d0d" rx="5"/>
    <rect x="150" y="468" width="44" height="14" fill="#ffd166" rx="6"/>
  </g>
  <g id="leg-right" style="transform-origin:220px 440px;">
    <rect x="206" y="440" width="26" height="30" fill="#3a0d0d" rx="5"/>
    <rect x="198" y="468" width="44" height="14" fill="#ffd166" rx="6"/>
  </g>

  <!-- BOTTLE BODY (slim hot sauce) -->
  <g id="bottle" style="transform-origin:195px 390px;">
    <path d="M160 240 L230 240 L238 300 L242 410 Q242 440 195 440 Q148 440 148 410 L152 300 Z" fill="#c62828"/>
    <path d="M168 246 L178 246 L172 420 L160 420 Z" fill="#e05252" opacity=".7"/>
    <!-- flame cap -->
    <path d="M195 196 Q214 216 210 232 Q206 244 195 244 Q184 244 180 232 Q176 216 195 196 Z" fill="#ff6b35"/>
    <path d="M195 204 Q204 216 201 228 Q198 234 195 234 Q192 234 189 228 Q186 216 195 204 Z" fill="#ffd166"/>
    <!-- label = flame tank -->
    <rect x="158" y="300" width="74" height="72" rx="6" fill="#2b0a0a"/>
    <rect x="168" y="308" width="54" height="14" rx="3" fill="#ff4757"/>
    <text x="195" y="320" font-family="monospace" font-size="10" fill="#fff" text-anchor="middle">AJI</text>
    <text x="195" y="344" font-family="monospace" font-size="8" fill="#ff6b35" text-anchor="middle">EXTRA HOT 🔥</text>
  </g>

  <!-- EYES (wild, excited) -->
  <g id="eyes" style="transform-origin:195px 288px;">
    <circle cx="176" cy="286" r="10" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="214" cy="286" r="10" fill="#fff" stroke="#111" stroke-width="2"/>
    <circle cx="178" cy="284" r="4.5" fill="#111"/>
    <circle cx="216" cy="284" r="4.5" fill="#111"/>
    <!-- manic brows -->
    <path d="M164 272 Q176 264 188 272" stroke="#111" stroke-width="2.5" fill="none"/>
    <path d="M202 272 Q214 264 226 272" stroke="#111" stroke-width="2.5" fill="none"/>
  </g>

  <!-- MOUTH (grin, chaos) -->
  <g id="mouth" style="transform-origin:195px 314px;">
    <path d="M178 308 Q195 326 212 308" stroke="#111" stroke-width="3" fill="#ffd166" stroke-linecap="round"/>
  </g>

  <!-- ARMS (flailing) -->
  <g id="arm-left" style="transform-origin:142px 288px;">
    <rect x="112" y="288" width="30" height="66" rx="10" fill="#c62828"/>
    <circle cx="127" cy="358" r="11" fill="#c62828"/>
  </g>
  <g id="arm-right" style="transform-origin:248px 288px;">
    <rect x="248" y="288" width="30" height="66" rx="10" fill="#c62828"/>
    <circle cx="263" cy="358" r="11" fill="#c62828"/>
  </g>

  <text x="20" y="498" font-family="monospace" font-size="10" fill="#888">AJI — slim hot sauce · THE SPARKPLUG · chaos with a flame cap · cutout rig for Rive</text>
</svg>
<div class="note">"You ain't ready for me, bro." — but with MORE fire. Aji brings heat and drama everywhere he rolls. Flame cap, manic eyes, always extra.</div>
</body>
</html>
