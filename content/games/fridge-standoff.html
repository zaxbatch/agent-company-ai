<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>FRIDGE STANDOFF</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d1117;overflow:hidden;font-family:"Courier New",monospace}
#wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;touch-action:none;max-width:100%;max-height:100%}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(6,10,18,.9);color:#e8f4ff;text-align:center;padding:24px;gap:10px}
#ov h1{font-size:clamp(24px,7vw,44px);letter-spacing:3px;color:#7fd4ff;text-shadow:0 0 12px #1b6fa8}
#ov p{font-size:clamp(12px,3.6vw,16px);line-height:1.6;max-width:420px;color:#b9d4e8}
#ov b{color:#ffd166}
#btn{margin-top:8px;padding:14px 34px;font:inherit;font-size:17px;letter-spacing:2px;cursor:pointer;
     background:#22608c;color:#eaf6ff;border:3px solid #7fd4ff;border-radius:8px}
#btn:hover{background:#2c7bb0}
.hide{display:none!important}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="720"></canvas></div>
<div id="ov">
  <h1>FRIDGE STANDOFF</h1>
  <p><b>Vin Negar</b> is loose in the fridge.<br>
     Catch the ingredients. Dodge the rival condiments.<br><br>
     <b>← →</b> or <b>A / D</b> or drag to move</p>
  <p id="hs"></p>
  <button id="btn">START</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=480,H=720,ov=document.getElementById('ov'),btn=document.getElementById('btn'),hsEl=document.getElementById('hs');
const GOOD=['🍅','🌶️','🧀','🥬','🧅','🥚','🍋','🍯'];
const BAD=['🥫','🍶','🌼','🌡️','🧴'];
const KY='fridgeStandoffHi';
let G,keys={},touchX=null;

function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',fit);fit();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if([' ','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();
  if(!G.run&&(e.key===' '||e.key==='Enter'))start();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;});
cv.addEventListener('pointerdown',e=>{touchX=px(e);});
cv.addEventListener('pointermove',e=>{if(touchX!==null)touchX=px(e);});
cv.addEventListener('pointerup',()=>{touchX=null;});
function px(e){const r=cv.getBoundingClientRect();return (e.clientX-r.left)/r.width*W;}

function reset(){G={run:true,score:0,lives:3,items:[],px:W/2,ps:7,spawn:0,t:0,speed:2.2,combo:0,flash:0,over:false};}
function start(){reset();ov.classList.add('hide');loop();}

function spawn(){
  const bad=Math.random()<0.34;
  G.items.push({x:30+Math.random()*(W-60),y:-40,vy:G.speed+Math.random()*1.4,
    e:bad?BAD[(Math.random()*BAD.length)|0]:GOOD[(Math.random()*GOOD.length)|0],
    bad,s:34+Math.random()*10,rot:(Math.random()-.5)*.06});
}
function update(dt){
  if(!G.run)return;G.t+=dt;
  if(keys['arrowleft']||keys['a'])G.px-=G.ps;
  if(keys['arrowright']||keys['d'])G.px+=G.ps;
  if(touchX!==null)G.px+=(touchX-G.px)*0.25;
  G.px=Math.max(28,Math.min(W-28,G.px));
  G.spawn-=dt;const rate=Math.max(14,34-G.t*0.35);
  if(G.spawn<=0){spawn();G.spawn=rate;}
  G.speed=2.2+G.t*0.055;
  const py=H-96,pr=30;
  for(let i=G.items.length-1;i>=0;i--){const it=G.items[i];it.y+=it.vy*dt*60/16.7;it.rot+=0.002;
    if(Math.hypot(it.x-G.px,it.y-py)<pr+it.s*0.5){
      if(it.bad){G.lives--;G.flash=1;G.combo=0;blip(160,.12,'sawtooth');if(G.lives<=0)die();}
      else{G.combo++;G.score+=10*Math.max(1,G.combo);blip(660+G.combo*40,.06,'square');}
      G.items.splice(i,1);continue;}
    if(it.y>H+60)G.items.splice(i,1);}
  if(G.flash>0)G.flash-=dt*0.06;
}
function die(){G.run=false;G.over=true;const hi=+(localStorage.getItem(KY)||0);
  if(G.score>hi)localStorage.setItem(KY,G.score);
  ov.classList.remove('hide');
  ov.querySelector('h1').textContent='STANDOFF OVER';
  ov.querySelector('p').innerHTML=`Score <b>${G.score}</b> &nbsp;·&nbsp; Best <b>${localStorage.getItem(KY)||0}</b><br><br>Vin got out-fridged.`;
  btn.textContent='RUN IT BACK';}
function draw(){
  ctx.fillStyle='#101827';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#16233a';ctx.fillRect(0,0,W,H);
  for(let y=0;y<H;y+=64){ctx.fillStyle='rgba(120,190,240,.05)';ctx.fillRect(0,y,W,2);}
  ctx.strokeStyle='#2a4a6a';ctx.lineWidth=4;ctx.strokeRect(6,6,W-12,H-12);
  // shelf
  ctx.fillStyle='#24405c';ctx.fillRect(0,H-70,W,10);
  for(const it of G.items){ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot);
    ctx.font=it.s+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(it.e,0,0);ctx.restore();}
  // player
  const bob=Math.sin(G.t*0.18)*3;
  ctx.save();ctx.translate(G.px,H-96+bob);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,34,26,8,0,0,7);ctx.fill();
  ctx.font='56px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍶',0,0);
  ctx.restore();
  // hud
  ctx.font='bold 22px "Courier New",monospace';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillStyle='#7fd4ff';ctx.fillText('SCORE '+G.score,18,16);
  ctx.fillStyle='#ffd166';if(G.combo>1)ctx.fillText('x'+G.combo+' COMBO',18,44);
  ctx.textAlign='right';ctx.fillStyle='#eaf6ff';
  ctx.fillText('❤️'.repeat(Math.max(0,G.lives)),W-18,16);
  if(G.flash>0){ctx.fillStyle='rgba(200,40,40,'+(G.flash*.5)+')';ctx.fillRect(0,0,W,H);}
}
let last=0;
function loop(ts){const dt=Math.min(3,((ts||0)-last)/16.7)||1;last=ts;update(dt);draw();if(G.run)requestAnimationFrame(loop);}
let AC;function blip(f,d,t){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();
  o.type=t;o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
hsEl.innerHTML='Best: <b>'+(localStorage.getItem(KY)||0)+'</b>';
btn.onclick=start;
reset();G.run=false;draw();
</script>
</body>
</html>
