<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Shelves Raised Us — MilkUps</title>
<style>
:root{--bg:#0d0b12;--card:#17141f;--acc:#ff5ea8;--acc2:#5ee8ff;--tx:#f2eff7;--mut:#9a93ad}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
padding:2rem 1rem 4rem;line-height:1.5}
.wrap{max-width:720px;margin:0 auto}
.hero{text-align:center;padding:2rem 0 2.5rem;border-bottom:1px solid #2a2436;margin-bottom:2rem}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--acc2);
border:1px solid #2a2436;padding:.35rem .8rem;border-radius:99px;margin-bottom:1rem}
h1{font-size:clamp(1.9rem,6vw,2.9rem);line-height:1.1;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin-top:.7rem;font-size:.95rem}
.track{background:var(--card);border:1px solid #241f2f;border-radius:14px;padding:1rem 1.15rem;margin-bottom:.85rem;
display:flex;align-items:center;gap:1rem;transition:border-color .2s,transform .2s}
.track:hover{border-color:var(--acc);transform:translateY(-2px)}
.num{font-variant-numeric:tabular-nums;color:var(--mut);font-size:.8rem;min-width:1.6rem}
.meta{flex:1;min-width:0}
.tt{font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{color:var(--mut);font-size:.78rem;margin-top:.15rem}
audio{width:min(240px,42vw);height:34px}
.foot{color:var(--mut);font-size:.78rem;text-align:center;margin-top:2.5rem;border-top:1px solid #241f2f;padding-top:1.5rem}
.foot b{color:var(--acc2)}
@media(max-width:560px){.track{flex-wrap:wrap}.track audio{width:100%}}
</style></head><body><div class="wrap">
<div class="hero">
  <div class="tag">MilkUps · New Release</div>
  <h1><span>The Shelves Raised Us</span></h1>
  <p class="sub">5 tracks · tracker cuts (.xm) · Z-Dot LLC</p>
</div>
<div id="list"></div>
<p class="foot">Built in-house by <b>Z-Dot LLC</b> — synthesized from scratch, no samples.</p>
</div>
<script>
const T=[
 ["01","Shelves Raised Us","118 BPM"],
 ["02","Milk Carton Club","126 BPM"],
 ["03","Aisle of Echoes","104 BPM"],
 ["04","Cooler Than Cool","132 BPM"],
 ["05","Best Before Forever","96 BPM"]];
document.getElementById('list').innerHTML=T.map(([n,t,b])=>`
<div class="track">
  <div class="num">${n}</div>
  <div class="meta"><div class="tt">${t}</div><div class="tb">${b}</div></div>
  <audio controls preload="metadata" src="trk${n}.mp3"></audio>
</div>`).join('');
</script></body></html>
