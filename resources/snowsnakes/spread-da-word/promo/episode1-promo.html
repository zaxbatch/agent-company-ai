<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0b1a2a; width:1280px; height:720px; overflow:hidden; font-family:'Courier New',monospace; }
  .scene { position:relative; width:1280px; height:720px; background:linear-gradient(#0e2233,#12395a); }
  .snow { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
  .card { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
  .card h1 { font-size:96px; color:#ffd166; letter-spacing:6px; text-shadow:4px 4px 0 #e94560; margin:0; }
  .card .sub { font-size:28px; color:#cfeeff; margin-top:16px; letter-spacing:3px; }
  #ice { position:absolute; bottom:60px; left:-340px; width:320px; }
  #vin { position:absolute; bottom:60px; right:-360px; width:330px; }
  .speech { position:absolute; top:90px; left:50%; transform:translateX(-50%); width:900px; background:#fff; color:#111; font-size:30px; font-weight:bold; padding:18px 28px; border-radius:14px; display:none; box-shadow:6px 6px 0 rgba(0,0,0,.4); text-align:center; }
  .speech .who { display:inline-block; font-size:20px; font-weight:bold; padding:2px 14px; border-radius:20px; margin-bottom:6px; }
  .who.ice { background:#7fd1ff; color:#0b1a2a; }
  .who.vin { background:#e94560; color:#fff; }
  .tag { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); font-size:24px; color:#ffd700; display:none; letter-spacing:2px; }
</style>
</head>
<body>
<div class="scene">
  <svg class="snow" width="1280" height="720" xmlns="http://www.w3.org/2000/svg"><g id="flakes"></g></svg>
  <div class="card" id="titleCard">
    <h1>SPREAD DA WORD</h1>
    <div class="sub">A SnowSnakes Original</div>
  </div>

  <!-- ICE: snow/ice bottle (blue, frosty, snowflake label) -->
  <svg id="ice" viewBox="0 0 320 440" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="160" cy="420" rx="90" ry="12" fill="#00000055"/>
    <g id="iLegL"><rect x="130" y="350" width="20" height="70" fill="#2a4a63" rx="5"/><rect x="126" y="410" width="28" height="14" fill="#0b1a2a" rx="5"/></g>
    <g id="iLegR"><rect x="170" y="350" width="20" height="70" fill="#2a4a63" rx="5"/><rect x="166" y="410" width="28" height="14" fill="#0b1a2a" rx="5"/></g>
    <g id="iArmL"><rect x="88" y="230" width="20" height="56" fill="#5aa8d8" rx="8"/><circle cx="98" cy="288" r="9" fill="#e8b88a"/></g>
    <g id="iArmR"><rect x="212" y="230" width="20" height="56" fill="#5aa8d8" rx="8"/><circle cx="222" cy="288" r="9" fill="#e8b88a"/></g>
    <g id="iBody">
      <path d="M 100 230 L 220 230 L 220 310 Q 220 350 190 350 L 130 350 Q 100 350 100 310 Z" fill="#7fd1ff"/>
      <path d="M 112 240 L 124 240 L 124 342 L 112 342 Z" fill="#dff3ff" opacity="0.7"/>
      <rect x="116" y="258" width="88" height="60" fill="#0f3a4f" rx="7"/>
      <text x="160" y="286" fill="#fff" font-size="22" font-family="monospace" text-anchor="middle" font-weight="bold">ICE</text>
      <text x="160" y="308" fill="#7fd1ff" font-size="13" font-family="monospace" text-anchor="middle">❄ THE COLD</text>
      <rect x="138" y="196" width="44" height="34" fill="#7fd1ff" rx="4"/>
      <rect x="130" y="186" width="60" height="16" fill="#0f3a4f" rx="4"/>
    </g>
    <g id="iShades">
      <rect x="128" y="250" width="24" height="14" rx="4" fill="#0b1a2a"/>
      <rect x="168" y="250" width="24" height="14" rx="4" fill="#0b1a2a"/>
      <rect x="150" y="252" width="18" height="6" fill="#0b1a2a"/>
    </g>
    <g id="iMouth"><rect x="146" y="284" width="28" height="5" fill="#0b1a2a" rx="2"/></g>
  </svg>

  <!-- VIN: apple cider vinegar (dark, gold chain) -->
  <svg id="vin" viewBox="0 0 340 440" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="170" cy="420" rx="100" ry="12" fill="#00000055"/>
    <g id="legL"><rect x="140" y="350" width="22" height="70" fill="#3b2a1a" rx="5"/><rect x="136" y="410" width="30" height="14" fill="#111" rx="5"/></g>
    <g id="legR"><rect x="180" y="350" width="22" height="70" fill="#3b2a1a" rx="5"/><rect x="176" y="410" width="30" height="14" fill="#111" rx="5"/></g>
    <g id="armL"><rect x="92" y="230" width="22" height="60" fill="#2f5d8a" rx="9"/><circle cx="103" cy="292" r="10" fill="#e8b88a"/></g>
    <g id="armR"><rect x="226" y="230" width="22" height="60" fill="#2f5d8a" rx="9"/><circle cx="237" cy="292" r="10" fill="#e8b88a"/></g>
    <g id="body">
      <path d="M 110 230 L 230 230 L 230 310 Q 230 350 198 350 L 142 350 Q 110 350 110 310 Z" fill="#4a2c08"/>
      <path d="M 124 240 L 138 240 L 138 342 L 124 342 Z" fill="#7a4a12" opacity="0.55"/>
      <rect x="128" y="262" width="84" height="62" fill="#1c1006" rx="7"/>
      <text x="170" y="292" fill="#ffd166" font-size="24" font-family="monospace" text-anchor="middle" font-weight="bold">VIN</text>
      <text x="170" y="314" fill="#cfeeff" font-size="14" font-family="monospace" text-anchor="middle">NEGAR</text>
      <rect x="146" y="196" width="48" height="34" fill="#4a2c08" rx="4"/>
      <rect x="138" y="186" width="64" height="16" fill="#1a1a1a" rx="4"/>
      <rect x="150" y="176" width="40" height="12" fill="#222" rx="3"/>
    </g>
    <g id="chain">
      <path d="M 138 218 q 10 8 32 8 q 22 0 32 -8" fill="none" stroke="#ffd700" stroke-width="6" stroke-linecap="round"/>
      <circle cx="170" cy="228" r="12" fill="none" stroke="#ffd700" stroke-width="5"/>
      <path d="M 165 228 l 10 0 l -5 10 z" fill="#ffd700"/>
    </g>
    <g id="shades">
      <rect x="136" y="252" width="26" height="15" rx="4" fill="#111"/>
      <rect x="178" y="252" width="26" height="15" rx="4" fill="#111"/>
      <rect x="160" y="254" width="18" height="7" fill="#222"/>
    </g>
    <g id="mouth"><rect x="154" y="286" width="32" height="5" fill="#111" rx="2"/></g>
  </svg>

  <div class="speech" id="speech"><div class="who" id="who"></div><div id="speechText"></div></div>
  <div class="tag" id="tag">NEXT EPISODE: SRI RACHA 🌶️</div>
</div>
<script>
(function(){
  var vin = document.getElementById('vin');
  var ice = document.getElementById('ice');
  var card = document.getElementById('titleCard');
  var speech = document.getElementById('speech');
  var who = document.getElementById('who');
  var speechText = document.getElementById('speechText');
  var tag = document.getElementById('tag');
  var t0 = performance.now();
  var LINES = [
    {t:3.2, d:2.2, who:'ice', text:"They call me snow. I stay cool."},
    {t:7.0, d:2.0, who:'vin', text:"You already know the name."},
    {t:9.4, d:2.2, who:'vin', text:"I'm the realist vinegar you know."},
    {t:11.8, d:2.2, who:'vin', text:"They call me sour. Sour keeps the good stuff fresh."},
    {t:14.2, d:1.8, who:'vin', text:"Spread the word. Tell your people."}
  ];
  var flakeG = document.getElementById('flakes');
  for(var i=0;i<60;i++){
    var r = document.createElementNS('http://www.w3.org/2000/svg','circle');
    r.setAttribute('cx', Math.random()*1280); r.setAttribute('cy', Math.random()*720);
    r.setAttribute('r', 2+Math.random()*3); r.setAttribute('fill','#fff'); r.setAttribute('opacity', .6);
    flakeG.appendChild(r);
  }
  function frame(){
    var t = (performance.now()-t0)/1000;
    if(t<1.6){ card.style.opacity=1; } else if(t<2.2){ card.style.opacity=Math.max(0,1-(t-1.6)/0.6); } else { card.style.display='none'; }
    // Ice slides in 1.6-3.2
    if(t>1.6){
      var p=Math.min(1,(t-1.6)/1.6), e=1-Math.pow(1-p,3);
      ice.style.left=(-340+e*300)+'px';
    }
    // Vin slides in 5.4-7.0
    if(t>5.4){
      var p2=Math.min(1,(t-5.4)/1.6), e2=1-Math.pow(1-p2,3);
      vin.style.right=(-360+e2*290)+'px';
    }
    // speaking animation
    var show=null;
    for(var i=0;i<LINES.length;i++){ if(t>LINES[i].t && t<LINES[i].t+LINES[i].d){ show=LINES[i]; break; } }
    if(show){
      speech.style.display='block';
      who.className='who '+(show.who==='ice'?'ice':'vin');
      who.textContent = show.who==='ice' ? 'ICE ❄' : 'VIN 🍶';
      speechText.textContent = show.text;
      var flap = Math.abs(Math.sin(t*14))<0.5 ? 1 : 0.4;
      if(show.who==='ice') ice.querySelector('#iMouth').setAttribute('transform','scale(1,'+flap+')');
      else vin.querySelector('#mouth').setAttribute('transform','scale(1,'+flap+')');
    } else { speech.style.display='none'; }
    if(t>15.5){ tag.style.display='block'; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
