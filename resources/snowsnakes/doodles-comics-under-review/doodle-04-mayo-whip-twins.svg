<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#1a2430"/>
  <!-- kitchen counter -->
  <rect y="420" width="800" height="180" fill="#8a6a4a"/>
  <rect y="420" width="800" height="14" fill="#9a7a5a"/>
  <!-- Mayo White (left, smooth) -->
  <g transform="translate(200,240)">
    <rect x="15" y="50" width="80" height="130" rx="14" fill="#f4f4f4"/>
    <rect x="38" y="10" width="34" height="45" rx="8" fill="#fafafa"/>
    <rect x="46" y="-14" width="18" height="28" rx="4" fill="#fff"/>
    <text x="55" y="105" font-size="12" fill="#666" text-anchor="middle" font-family="monospace">MAYO</text>
    <circle cx="42" cy="32" r="6" fill="#111"/>
    <circle cx="70" cy="32" r="6" fill="#111"/>
    <circle cx="43" cy="31" r="2.5" fill="#fff"/>
    <circle cx="69" cy="31" r="2.5" fill="#fff"/>
    <path d="M45 50 Q56 58 67 50" stroke="#111" stroke-width="3" fill="none"/>
  </g>
  <!-- Whip (right, ambitious) -->
  <g transform="translate(480,250)">
    <rect x="15" y="50" width="80" height="120" rx="14" fill="#f8e6c8"/>
    <rect x="38" y="10" width="34" height="45" rx="8" fill="#fdf0dc"/>
    <rect x="46" y="-14" width="18" height="28" rx="4" fill="#ffe8c0"/>
    <text x="55" y="100" font-size="12" fill="#8a6a3a" text-anchor="middle" font-family="monospace">WHIP</text>
    <circle cx="42" cy="32" r="6" fill="#111"/>
    <circle cx="70" cy="32" r="6" fill="#111"/>
    <circle cx="43" cy="31" r="2.5" fill="#fff"/>
    <circle cx="69" cy="31" r="2.5" fill="#fff"/>
    <path d="M45 50 Q56 44 67 50" stroke="#111" stroke-width="3" fill="none"/>
  </g>
  <!-- sparkles between -->
  <g fill="#ffd166">
    <path d="M390 200 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 Z"/>
    <path d="M410 260 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 Z"/>
  </g>
  <rect x="250" y="120" width="200" height="44" rx="16" fill="#fff"/>
  <text x="350" y="148" font-size="16" fill="#111" text-anchor="middle" font-family="monospace">I'm not Mayo. I'm ME.</text>
  <rect x="240" y="330" width="220" height="44" rx="16" fill="#fff"/>
  <text x="350" y="358" font-size="16" fill="#111" text-anchor="middle" font-family="monospace">Let's keep it smooth…</text>
  <text x="400" y="560" font-size="24" fill="#ffd166" text-anchor="middle" font-family="monospace" font-weight="bold">THE TWINS — SAME SHELF, DIFFERENT GAME</text>
</svg>
